locationBuilders['yazd'] = function(scene, camera, controls) {
  camera.position.set(0, 2.2, 0);
  controls.target.set(0, 2.5, -8);
  controls.minDistance=0.3;controls.maxDistance=22;
  controls.maxPolarAngle=Math.PI*0.82;controls.minPolarAngle=Math.PI*0.05;
  controls.autoRotateSpeed=0.11;
  if(locRenderer){locRenderer.toneMapping=THREE.ACESFilmicToneMapping;locRenderer.toneMappingExposure=1.1;}

  const uni={uTime:{value:0}};

  // Warm afternoon desert sky
  const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,uniforms:uni,
    vertexShader:`varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`varying vec3 vP;
      void main(){float h=normalize(vP).y;
        vec3 c=h<0.0?vec3(0.60,0.42,0.22):
               h<0.25?mix(vec3(0.82,0.68,0.42),vec3(0.55,0.70,0.90),h/0.25):
               mix(vec3(0.55,0.70,0.90),vec3(0.28,0.48,0.80),(h-0.25)/0.75);
        gl_FragColor=vec4(c,1.0);}`});
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(80,32,16),skyMat));

  scene.add(new THREE.AmbientLight(0x8a6040,0.9));
  const sunL=new THREE.DirectionalLight(0xffdd88,2.2);
  sunL.position.set(3,5,-4);scene.add(sunL);
  scene.add(new THREE.HemisphereLight(0xddaa66,0x3a2010,0.4));

  function mkTexY(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}

  // Pre-build 5 adobe textures with tone/crack variation
  const _adobeTexes=(()=>{
    const arr=[];
    for(let seed=0;seed<5;seed++){
      arr.push(mkTexY(512,512,(ctx,W,H)=>{
        const bv=[0.72,0.68,0.75,0.70,0.66][seed];
        ctx.fillStyle=`rgb(${Math.round(185*bv)},${Math.round(143*bv)},${Math.round(92*bv)})`;ctx.fillRect(0,0,W,H);
        // Horizontal construction layers (sun-dried mud courses)
        const lh=20;
        for(let l=0;l<H;l+=lh){
          const cv=0.92+(Math.abs(Math.sin((l+seed*77)*0.07)))*0.08;
          ctx.fillStyle=`rgb(${Math.round(180*bv*cv)},${Math.round(140*bv*cv)},${Math.round(88*bv*cv)})`;ctx.fillRect(0,l+2,W,lh-3);
          ctx.fillStyle=`rgba(65,40,18,${0.16+(Math.abs(Math.sin(l*0.09+seed)))*0.08})`;ctx.fillRect(0,l,W,2);
        }
        // Vertical joints (offset per course, irregular)
        ctx.strokeStyle=`rgba(70,45,20,0.16)`;ctx.lineWidth=1.2;
        for(let l=0,row=0;l<H;l+=lh,row++){
          const off=row%2===0?0:W*0.20;
          for(let x=off;x<W+off;x+=W*0.22+(seed*17)%30){
            const jx=x%W;
            ctx.beginPath();ctx.moveTo(jx+(Math.sin(row*jx*0.005)-0.5)*5,l+2);ctx.lineTo(jx+(Math.sin(row*jx*0.005+1)-0.5)*5,l+lh-1);ctx.stroke();
          }
        }
        // Desiccation cracks
        ctx.strokeStyle=`rgba(85,55,25,0.22)`;ctx.lineWidth=0.8;
        for(let ci=0;ci<12+seed*2;ci++){
          const sx=(ci*W/12+seed*37)%W,sy=(ci*H/12+seed*53)%H;
          ctx.beginPath();ctx.moveTo(sx,sy);
          ctx.bezierCurveTo(sx+(Math.sin(ci*seed*2.3+1)-0.5)*55,sy+(Math.cos(ci*seed*1.7+2)-0.5)*45,sx+(Math.cos(ci*seed*3.1+3)-0.5)*45,sy+(Math.sin(ci*seed*2.1+4)-0.5)*65,sx+(Math.sin(ci*seed*1.3+5)-0.5)*95,sy+(Math.cos(ci*seed*2.7+6)-0.5)*85);
          ctx.stroke();
        }
        // Surface texture patches
        for(let pi=0;pi<40;pi++){
          const px=(pi*(W/40)+seed*23)%W,py=(pi*(H/40)+seed*41)%H;
          const pr=6+Math.abs(Math.sin(pi*seed*0.3))*14;
          ctx.beginPath();ctx.arc(px,py,pr,0,Math.PI*2);
          ctx.fillStyle=`rgba(${135+seed*5},${100+seed*4},${60+seed*2},0.12)`;ctx.fill();
        }
      }));
    }
    return arr;
  })();

  function adobeMat(seed){
    const idx=Math.abs(Math.round(seed*3.7))%_adobeTexes.length;
    const t=_adobeTexes[idx].clone();
    t.repeat.set(2+(idx%2),1+(idx%2));
    return new THREE.MeshStandardMaterial({map:t,roughness:0.92,metalness:0.0,side:THREE.DoubleSide});
  }

  // Sandy ground
  const flMat=new THREE.ShaderMaterial({side:THREE.FrontSide,
    vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`varying vec2 vUv;
      float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
      float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
        return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
      void main(){
        float worn=n(vUv*6.0)*0.25+n(vUv*18.0)*0.10;
        vec3 c=vec3(0.70+worn*0.06,0.56+worn*0.04,0.38+worn*0.02);
        gl_FragColor=vec4(c,1.0);}`});
  const fl=new THREE.Mesh(new THREE.PlaneGeometry(80,80),flMat);
  fl.rotation.x=-Math.PI/2;scene.add(fl);

  // Narrow alley walls
  [-4.5,4.5].forEach((x,side)=>{
    const wall=new THREE.Mesh(new THREE.BoxGeometry(0.6,7,50),adobeMat(side*10));
    wall.position.set(x,3.5,-15);scene.add(wall);
    // Irregular wall cuts / doors
    [[-6,0],[-12,0],[5,0]].forEach(([z])=>{
      const door=new THREE.Mesh(new THREE.BoxGeometry(0.7,2.5,1.8),
        new THREE.MeshBasicMaterial({color:0x1a0c06}));
      door.position.set(x+(side?-0.3:0.3),1.25,z);scene.add(door);
    });
  });

  // Background buildings: cubes of varying height
  const h3=Math.random;
  for(let bi=0;bi<28;bi++){
    const bw=3+Math.random()*5;const bh=4+Math.random()*10;const bd=3+Math.random()*5;
    const bx=(Math.random()-0.5)*60;const bz=-20-Math.random()*40;
    if(Math.abs(bx)<6&&bz>-25)continue;
    const b=new THREE.Mesh(new THREE.BoxGeometry(bw,bh,bd),adobeMat(bi*3.7));
    b.position.set(bx,bh/2,bz);scene.add(b);
    // Rooftop parapet
    const par=new THREE.Mesh(new THREE.BoxGeometry(bw+0.2,0.5,bd+0.2),adobeMat(bi*2.1));
    par.position.set(bx,bh+0.25,bz);scene.add(par);
  }

  // Badgir (windtower) — iconic Yazd feature
  function badgir(x,z,h4){
    const g=new THREE.Group();
    // Shaft
    const shaft=new THREE.Mesh(new THREE.BoxGeometry(1.4,h4,1.4),adobeMat(x+z));
    shaft.position.y=h4/2;g.add(shaft);
    // Four wind scoops at top
    [-1,1].forEach(dx=>{
      [-1,1].forEach(dz=>{
        const scoop=new THREE.Mesh(new THREE.BoxGeometry(0.5,1.8,0.5),adobeMat(dx+dz));
        scoop.position.set(dx*0.5,h4+0.9,dz*0.5);g.add(scoop);
      });
    });
    // Cap
    const cap2=new THREE.Mesh(new THREE.ConeGeometry(1.2,1.2,4),
      new THREE.MeshStandardMaterial({color:0x8a6a48,roughness:0.9}));
    cap2.position.y=h4+2.0;g.add(cap2);
    g.position.set(x,0,z);scene.add(g);
  }
  badgir(-8,-12,12);badgir(10,-18,15);badgir(-12,-28,10);badgir(5,-8,13);

  // Mosque dome visible at end of alley
  const mosque2=new THREE.Group();
  const domeM=new THREE.ShaderMaterial({side:THREE.DoubleSide,
    vertexShader:`varying vec3 vN;void main(){vN=normalMatrix*normal;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`varying vec3 vN;
      void main(){
        float lng=atan(vN.x,vN.z),lat=asin(vN.y);
        vec3 blue=vec3(0.12,0.28,0.75);vec3 turq2=vec3(0.08,0.56,0.62);
        float geo=sin(lng*12.0)*sin(lat*8.0)*0.5+0.5;
        vec3 c=mix(blue,turq2,geo);
        float lt=dot(normalize(vN),normalize(vec3(0.3,1.0,0.2)))*0.5+0.5;
        c*=0.6+lt*0.5;gl_FragColor=vec4(c,1.0);}` });
  const d=new THREE.Mesh(new THREE.SphereGeometry(5,24,14,0,Math.PI*2,0,Math.PI*0.55),domeM);
  d.position.y=8;mosque2.add(d);
  const dm=new THREE.Mesh(new THREE.CylinderGeometry(5,5,4,20),
    new THREE.MeshStandardMaterial({color:0x1840a0,roughness:0.6}));
  dm.position.y=6;mosque2.add(dm);
  const tw=new THREE.Mesh(new THREE.BoxGeometry(12,9,0.5),adobeMat(99));
  tw.position.y=4.5;mosque2.add(tw);
  mosque2.position.set(0,0,-42);scene.add(mosque2);

  // Overhead cloth/shadows
  for(let ci=0;ci<4;ci++){
    const cloth=new THREE.Mesh(new THREE.PlaneGeometry(3,8),
      new THREE.MeshBasicMaterial({color:new THREE.Color(0.35+ci*0.04,0.20,0.08),transparent:true,opacity:0.65,side:THREE.DoubleSide}));
    cloth.rotation.x=-Math.PI/12*(ci%2?1:-1);
    cloth.position.set((ci%2?-2:2),5.5,-8-ci*3);
    scene.add(cloth);
  }

  // Dust motes
  const DN2=300,dP2=new Float32Array(DN2*3),dS2=new Float32Array(DN2);
  for(let i=0;i<DN2;i++){dP2[i*3]=(Math.random()-0.5)*9;dP2[i*3+1]=Math.random()*6;dP2[i*3+2]=(Math.random()-0.5)*40-10;dS2[i]=Math.random()*1.5+0.4;}
  const dGeo2=new THREE.BufferGeometry();
  dGeo2.setAttribute('position',new THREE.BufferAttribute(dP2,3));
  dGeo2.setAttribute('size',new THREE.BufferAttribute(dS2,1));
  const dUni2={uTime:{value:0}};
  scene.add(new THREE.Points(dGeo2,new THREE.ShaderMaterial({
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:dUni2,
    vertexShader:`attribute float size;uniform float uTime;varying float vA;void main(){vec3 p=position;p.x+=sin(uTime*0.15+p.z)*0.3;p.y+=cos(uTime*0.10+p.x)*0.15;vec4 mv=modelViewMatrix*vec4(p,1.0);gl_PointSize=size*(55.0/-mv.z);gl_Position=projectionMatrix*mv;vA=0.12*smoothstep(200.0,4.0,-mv.z);}`,
    fragmentShader:`varying float vA;void main(){float d=length(gl_PointCoord-0.5);gl_FragColor=vec4(0.88,0.72,0.45,smoothstep(0.5,0.1,d)*vA);}`})));

  return{update(t){uni.uTime.value=t;dUni2.uTime.value=t;},dispose(){}};
};

// ============================================================
//  DASHT-E LUT — Desert with Kaluts (yardangs)
// ============================================================
locationBuilders['dasht-e-lut'] = function(scene, camera, controls) {
  camera.position.set(0, 3.5, 20);
  controls.target.set(0, 4, 0);
  controls.minDistance=1;controls.maxDistance=50;
  controls.maxPolarAngle=Math.PI*0.80;controls.minPolarAngle=Math.PI*0.04;
  controls.autoRotateSpeed=0.07;
  if(locRenderer){locRenderer.toneMapping=THREE.ACESFilmicToneMapping;locRenderer.toneMappingExposure=1.3;}

  const uni={uTime:{value:0}};

  // Extreme heat haze sky
  const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,uniforms:uni,
    vertexShader:`varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`uniform float uTime;varying vec3 vP;
      void main(){float h=normalize(vP).y;
        // Bleached white-blue at zenith, orange-white at horizon (extreme heat)
        vec3 zen=vec3(0.50,0.68,0.90);vec3 mid2=vec3(0.85,0.72,0.52);vec3 hor=vec3(0.92,0.78,0.55);
        vec3 c=h<0.0?vec3(0.72,0.58,0.38):h<0.2?mix(hor,mid2,h/0.2):mix(mid2,zen,(h-0.2)/0.8);
        // Heat shimmer bands near horizon
        float haze=smoothstep(0.15,0.0,h)*sin(vP.x*0.3+uTime*0.8)*0.03;
        c+=haze;
        gl_FragColor=vec4(c,1.0);}`});
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(100,32,16),skyMat));

  scene.add(new THREE.AmbientLight(0xd08840,0.7));
  const sunL=new THREE.DirectionalLight(0xffffff,3.5);
  sunL.position.set(0,10,-3);scene.add(sunL);

  function mkTexL(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}

  // Salt flat — hand-drawn Voronoi polygon cracks
  const _saltTex=mkTexL(1024,1024,(ctx,W,H)=>{
    ctx.fillStyle='#c8b890';ctx.fillRect(0,0,W,H);
    // Generate Voronoi sites
    const N=140;
    const sites=[];
    for(let i=0;i<N;i++) sites.push([(i*W/N+i*37)%W,(i*H/N+i*53)%H]);
    // Draw polygon regions with slightly different tones
    for(let si=0;si<N;si++){
      const v=0.82+(Math.abs(Math.sin(si*3.7)))*0.18;
      ctx.fillStyle=`rgb(${Math.round(202*v)},${Math.round(184*v)},${Math.round(145*v)})`;
      // Simple bounding approach: fill large rect at site then clip won't work easily
      // Instead draw filled point and rely on crack lines to define cells
      ctx.beginPath();ctx.arc(sites[si][0],sites[si][1],W/Math.sqrt(N)*0.48,0,Math.PI*2);ctx.fill();
    }
    // Blend pass for smoother base
    ctx.fillStyle='rgba(200,182,142,0.45)';ctx.fillRect(0,0,W,H);
    // Draw crack lines between nearby sites
    ctx.strokeStyle='rgba(80,60,30,0.72)';ctx.lineWidth=2.5;
    for(let i=0;i<N;i++){
      for(let j=i+1;j<N;j++){
        const dx=sites[j][0]-sites[i][0],dy=sites[j][1]-sites[i][1];
        const dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<W/9){
          const mx=(sites[i][0]+sites[j][0])/2,my=(sites[i][1]+sites[j][1])/2;
          ctx.lineWidth=1.8+Math.abs(Math.sin(i*j*0.001))*2;
          ctx.strokeStyle=`rgba(${72+Math.round(Math.sin(i*7)*12)},${50+Math.round(Math.sin(j*5)*8)},${22},${0.55+Math.abs(Math.sin(i+j))*0.25})`;
          ctx.beginPath();ctx.moveTo(sites[i][0],sites[i][1]);ctx.lineTo(mx,my);ctx.stroke();
          ctx.beginPath();ctx.moveTo(sites[j][0],sites[j][1]);ctx.lineTo(mx,my);ctx.stroke();
        }
      }
    }
    // Shadow along crack edges
    ctx.strokeStyle='rgba(140,108,60,0.35)';ctx.lineWidth=5;
    for(let i=0;i<N;i++){
      for(let j=i+1;j<N;j++){
        const dx=sites[j][0]-sites[i][0],dy=sites[j][1]-sites[i][1];
        if(Math.sqrt(dx*dx+dy*dy)<W/9){
          const mx=(sites[i][0]+sites[j][0])/2,my=(sites[i][1]+sites[j][1])/2;
          ctx.beginPath();ctx.moveTo(sites[i][0]+1,sites[i][1]+1);ctx.lineTo(mx+1,my+1);ctx.stroke();
        }
      }
    }
  });

  // Rock erosion texture for kaluts
  const _rockTex=mkTexL(512,512,(ctx,W,H)=>{
    ctx.fillStyle='#6a4a2a';ctx.fillRect(0,0,W,H);
    // Horizontal erosion bands (wind scouring)
    const bandH=12;
    for(let y=0;y<H;y+=bandH){
      const dark=y%24<12;
      const v=dark?0.62:0.78;const sd=Math.sin(y*0.09)*0.08;
      ctx.fillStyle=`rgb(${Math.round((108+sd*20)*v)},${Math.round((75+sd*15)*v)},${Math.round((38+sd*10)*v)})`;
      ctx.fillRect(0,y,W,bandH);
      // Rough edge
      if(!dark){
        ctx.strokeStyle='rgba(180,130,70,0.18)';ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(0,y+bandH-1);
        for(let x=0;x<W;x+=8) ctx.lineTo(x,y+bandH-1+(Math.sin(x*y*0.001+y)*2));
        ctx.stroke();
      }
    }
    // Vertical wind grooves
    ctx.strokeStyle='rgba(50,32,14,0.25)';ctx.lineWidth=1.2;
    for(let x=0;x<W;x+=W/30){
      ctx.beginPath();ctx.moveTo(x+(Math.sin(x*0.1)-0.5)*4,0);
      for(let y2=0;y2<H;y2+=20) ctx.lineTo(x+(Math.sin(y2*0.03+x*0.1)-0.5)*6,y2);
      ctx.stroke();
    }
    // Surface gravel dots
    ctx.fillStyle='rgba(90,65,30,0.30)';
    for(let pi=0;pi<80;pi++){
      const px=(pi*W/80+pi*37)%W,py=(pi*H/80+pi*53)%H;
      ctx.beginPath();ctx.arc(px,py,2+Math.abs(Math.sin(pi*1.7))*4,0,Math.PI*2);ctx.fill();
    }
  });

  // Vast flat cracked desert floor
  const flTex=_saltTex.clone();flTex.repeat.set(8,8);
  const fl2=new THREE.Mesh(new THREE.PlaneGeometry(160,160),
    new THREE.MeshStandardMaterial({map:flTex,roughness:0.90,metalness:0.0}));
  fl2.rotation.x=-Math.PI/2;scene.add(fl2);

  // Kaluts (yardangs): tall eroded clay towers, wind-sculpted
  function kalut(x,z,h4,w,d){
    const g=new THREE.Group();
    const rockT=_rockTex.clone();rockT.repeat.set(1,Math.ceil(h4/4));
    const mat=new THREE.MeshStandardMaterial({map:rockT,roughness:0.88,metalness:0.0,side:THREE.DoubleSide});
    const box=new THREE.Mesh(new THREE.BoxGeometry(w,h4,d,1,4,1),mat);
    box.position.y=h4/2;
    const bVerts=box.geometry.attributes.position;
    for(let vi=0;vi<bVerts.count;vi++){
      const vy=bVerts.getY(vi);const nt=(vy+h4/2)/h4;
      if(nt>0.5){const sc=1.0-(nt-0.5)*1.1;bVerts.setX(vi,bVerts.getX(vi)*sc);bVerts.setZ(vi,bVerts.getZ(vi)*sc);}
    }
    bVerts.needsUpdate=true;box.geometry.computeVertexNormals();
    g.add(box);
    g.position.set(x,0,z);scene.add(g);
  }

  // City of Kaluts
  [[0,0,22,6,5],[8,-8,18,4,4],[-10,-5,16,5,3],[15,-15,25,7,6],[-14,-12,20,4,5],
   [5,-20,14,3,4],[-6,-22,19,5,4],[20,-10,28,8,5],[22,-25,15,4,3],[-20,-20,12,3,3],
   [-5,-35,24,6,4],[10,-30,18,4,5],[18,-35,21,5,4],[-18,-30,16,4,3],[0,-40,22,6,5]
  ].forEach(([x,z,h4,w,d])=>kalut(x,z,h4,w,d));

  // Sand dunes in foreground
  const duneGeo=new THREE.PlaneGeometry(120,40,80,20);
  const duneVerts=duneGeo.attributes.position;
  for(let i=0;i<duneVerts.count;i++){
    const x=duneVerts.getX(i),y=duneVerts.getY(i);
    const dune=Math.sin(x*0.15)*2.5+Math.sin(x*0.07+y*0.1)*1.5+Math.sin(x*0.22+y*0.08)*0.8;
    duneVerts.setZ(i,Math.max(0,dune));
  }
  duneGeo.computeVertexNormals();
  const duneMat=new THREE.ShaderMaterial({side:THREE.FrontSide,
    vertexShader:`varying vec2 vUv;varying vec3 vN;void main(){vUv=uv;vN=normalMatrix*normal;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`varying vec2 vUv;varying vec3 vN;
      void main(){
        float sl=dot(normalize(vN),normalize(vec3(0.0,1.0,-0.3)))*0.5+0.5;
        vec3 c=vec3(0.78,0.62,0.40)*sl;
        c=mix(c*0.65,c,sl);gl_FragColor=vec4(c,1.0);}`});
  const dunes=new THREE.Mesh(duneGeo,duneMat);
  dunes.rotation.x=-Math.PI/2;dunes.position.set(0,0,22);scene.add(dunes);

  // Blowing sand particles
  const DN3=600,dP3=new Float32Array(DN3*3),dS3=new Float32Array(DN3);
  for(let i=0;i<DN3;i++){dP3[i*3]=(Math.random()-0.5)*50;dP3[i*3+1]=Math.random()*4;dP3[i*3+2]=(Math.random()-0.5)*60;dS3[i]=Math.random()*2.5+0.5;}
  const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(dP3,3));sg.setAttribute('size',new THREE.BufferAttribute(dS3,1));
  const sUni={uTime:{value:0}};
  scene.add(new THREE.Points(sg,new THREE.ShaderMaterial({
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:sUni,
    vertexShader:`attribute float size;uniform float uTime;varying float vA;void main(){vec3 p=position;p.x=mod(p.x+uTime*2.0+50.0,100.0)-50.0;p.y+=sin(uTime*0.5+p.x*0.2)*0.3;vec4 mv=modelViewMatrix*vec4(p,1.0);gl_PointSize=size*(40.0/-mv.z);gl_Position=projectionMatrix*mv;vA=0.12*smoothstep(200.0,5.0,-mv.z);}`,
    fragmentShader:`varying float vA;void main(){float d=length(gl_PointCoord-0.5);gl_FragColor=vec4(0.82,0.65,0.38,smoothstep(0.5,0.1,d)*vA);}`})));

  return{update(t){uni.uTime.value=t;sUni.uTime.value=t;},dispose(){}};
};

// ============================================================
//  TABRIZ BAZAAR — UNESCO covered bazaar
// ============================================================
locationBuilders['tabriz'] = function(scene, camera, controls) {
  camera.position.set(0, 2.2, 10);
  controls.target.set(0, 3.5, -8);
  controls.minDistance=0.3;controls.maxDistance=20;
  controls.maxPolarAngle=Math.PI*0.82;controls.minPolarAngle=Math.PI*0.05;
  controls.autoRotateSpeed=0.10;
  if(locRenderer){locRenderer.toneMapping=THREE.ACESFilmicToneMapping;locRenderer.toneMappingExposure=1.0;}

  const uni={uTime:{value:0}};
  scene.fog=new THREE.FogExp2(0x2a1a0a,0.012);

  // Warm amber bazaar lighting
  scene.add(new THREE.AmbientLight(0x5a3010,1.0));
  [[-4,5.5,0],[4,5.5,0],[0,5.5,-10],[0,5.5,-20],[-4,5.5,-10],[4,5.5,-10]].forEach(([x,y,z])=>{
    const pl=new THREE.PointLight(0xffaa44,2.0,14,1.8); pl.position.set(x,y,z); scene.add(pl);
  });
  // Shaft of light from oculi
  [-8,-16,-24].forEach(z=>{
    const sl=new THREE.SpotLight(0xffd090,3.0,14,Math.PI/8,0.4,1.5); sl.position.set(0,10.5,z); scene.add(sl);
  });

  function mkTexT(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}

  // Canvas running-bond brick — aged Tabriz terracotta
  const _brickTexes=[0,1,2].map(seed=>mkTexT(512,256,(ctx,W,H)=>{
    ctx.fillStyle=`rgb(${180+seed*4},${148+seed*3},${110+seed*2})`;ctx.fillRect(0,0,W,H);
    const bW=42,bH=20,rows=Math.ceil(H/bH)+1,cols=Math.ceil(W/bW)+2;
    for(let r=0;r<rows;r++){
      const ox=r%2===0?0:bW/2;
      for(let c2=0;c2<cols;c2++){
        const x=c2*bW-ox,y=r*bH;
        const sd=(r*cols+c2)*7+seed*31;
        const bv=0.70+(Math.abs(Math.sin(sd*7.1)))*0.26;
        const fire=Math.abs(Math.sin(sd*1.3))*0.12;
        ctx.fillStyle=`rgb(${Math.round((148+seed*4)*bv+fire*20)},${Math.round((95+seed*3)*bv)},${Math.round((48+seed*2)*bv)})`;
        ctx.fillRect(x+2,y+3,bW-4,bH-5);
        // Top edge highlight (fired glaze)
        ctx.fillStyle=`rgba(220,185,140,${0.08+(Math.abs(Math.sin(sd*2.7)))*0.12})`;
        ctx.fillRect(x+2,y+3,bW-4,2);
        // Bottom edge shadow
        ctx.fillStyle=`rgba(60,30,10,${0.10+(Math.abs(Math.sin(sd*1.9)))*0.08})`;
        ctx.fillRect(x+2,y+bH-5,bW-4,2);
      }
    }
    // Mortar stain overlay
    ctx.strokeStyle=`rgba(30,15,6,0.14)`;ctx.lineWidth=0.8;
    for(let r=0;r<rows;r++){const ox=r%2===0?0:bW/2;for(let c2=0;c2<cols;c2++){ctx.strokeRect(c2*bW-ox+2,r*bH+3,bW-4,bH-5);}}
  }));
  function brickMat(seed){
    const t=_brickTexes[Math.abs(Math.round(seed))%_brickTexes.length].clone();
    t.repeat.set(4,3);
    return new THREE.MeshStandardMaterial({map:t,roughness:0.88,metalness:0.0,side:THREE.DoubleSide});
  }

  // Canvas worn stone floor tiles
  const _floorTile=mkTexT(1024,512,(ctx,W,H)=>{
    ctx.fillStyle='#7a6a54';ctx.fillRect(0,0,W,H);
    const cols=9,rows=5,tw=W/cols,th=H/rows;
    for(let r=0;r<rows;r++) for(let c2=0;c2<cols;c2++){
      const x=c2*tw,y=r*th,sd=r*11+c2*7;
      const v=0.58+(Math.abs(Math.sin(sd*5.3)))*0.30;
      ctx.fillStyle=`rgb(${Math.round(130*v)},${Math.round(112*v)},${Math.round(88*v)})`;
      ctx.fillRect(x+2,y+2,tw-4,th-4);
      // Wear: lighter center, darker edges
      const grd=ctx.createRadialGradient(x+tw/2,y+th/2,0,x+tw/2,y+th/2,tw*0.6);
      grd.addColorStop(0,`rgba(255,240,200,${0.04+(Math.abs(Math.sin(sd*2.1)))*0.06})`);
      grd.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=grd;ctx.fillRect(x+2,y+2,tw-4,th-4);
    }
    ctx.strokeStyle='rgba(25,15,8,0.50)';ctx.lineWidth=3;
    for(let i=0;i<=cols;i++){ctx.beginPath();ctx.moveTo(i*tw,0);ctx.lineTo(i*tw,H);ctx.stroke();}
    for(let i=0;i<=rows;i++){ctx.beginPath();ctx.moveTo(0,i*th);ctx.lineTo(W,i*th);ctx.stroke();}
  });

  // Floor: worn stone tiles
  const flT2=_floorTile.clone();flT2.repeat.set(3,8);
  const fl3=new THREE.Mesh(new THREE.PlaneGeometry(14,60),
    new THREE.MeshStandardMaterial({map:flT2,roughness:0.82,metalness:0.0}));
  fl3.rotation.x=-Math.PI/2;fl3.position.set(0,0,-18);scene.add(fl3);

  // Side walls with brick and arch indentations
  [-6,6].forEach((x,side)=>{
    const wall=new THREE.Mesh(new THREE.BoxGeometry(0.6,8.5,60),brickMat(side*5));
    wall.position.set(x,4.25,-18);scene.add(wall);
    // Arched alcoves
    for(let ai=0;ai<6;ai++){

function onResize() {
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
}

// ============================================================
//  ANIMATE
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  controls.update();
  if(particleUniforms) particleUniforms.uTime.value=t;

  // Star twinkle
  scene.traverse(o=>{
    if(o.userData.mat&&o.userData.mat.uniforms.uTime) o.userData.mat.uniforms.uTime.value=t;
    if(o.userData.seaMat) o.userData.seaMat.uniforms.uTime.value=t;
  });

  // Connection flow particles
  connectionMeshes.forEach(obj => {
    if(obj.userData.curve) {
      const curve = obj.userData.curve;
      const n = obj.userData.flowN;
      const posAttr = obj.geometry.attributes.position;
      for(let i=0;i<n;i++) {
        const prog = ((t * 0.12 + i / n) % 1.0);
        const pt = curve.getPoint(prog);
        posAttr.setXYZ(i, pt.x, pt.y, pt.z);
      }
      posAttr.needsUpdate = true;
    }
  });

  // Markers
  markerGroups.forEach((m,i)=>{
    const s=t+i*1.1;
    m.crystalWire.position.y=8+Math.sin(s*0.8)*0.8;
    m.crystalSolid.position.y=m.crystalWire.position.y;
    m.crystalWire.rotation.y=s*0.3;
    m.crystalSolid.rotation.y=s*0.3;
    m.crystalWire.rotation.x=Math.sin(s*0.2)*0.15;
    m.crystalSolid.rotation.x=m.crystalWire.rotation.x;
    const p=0.85+Math.sin(s*1.2)*0.15;
    m.ring.scale.set(p,p,p);
    if(hoveredIndex!==i) m.light.intensity=2.5+Math.sin(s*1.5)*0.8;
  });

  // Compass rotation (tracks camera azimuth)
  updateCompass();

  // Geo reference labels
  updateGeoLabels();

  if(appState==='hub') updateLabelPositions();
  renderer.render(scene,camera);
}

// ============================================================
//  COMPASS
// ============================================================
function updateCompass() {
  // Camera azimuth: angle of camera around Y looking at target
  const dx = camera.position.x - controls.target.x;
  const dz = camera.position.z - controls.target.z;
  const angle = Math.atan2(dx, dz); // radians, 0 = looking from +Z
  // In our coordinate system, -Z = North (higher lat), so angle 0 = looking from south
  const deg = angle * (180 / Math.PI);
  const needleN = document.getElementById('compass-needle-n');
  const needleS = document.getElementById('compass-needle-s');
  const compassN = document.getElementById('compass-N');
  const compassS = document.getElementById('compass-S');
  const compassE = document.getElementById('compass-E');
  const compassW = document.getElementById('compass-W');
  if (!needleN) return;
  const svg = document.querySelector('#compass svg');
  // Rotate inner content
  const inner = `rotate(${deg}, 50, 50)`;
  needleN.setAttribute('transform', inner);
  needleS.setAttribute('transform', inner);
  // Place cardinal letters at rotated positions
  const r = 44;
  const dirs = [
    { el: compassN, a: deg },
    { el: compassS, a: deg + 180 },
    { el: compassE, a: deg + 90 },
    { el: compassW, a: deg - 90 },
  ];
  dirs.forEach(({ el, a }) => {
    const rad = a * Math.PI / 180;
    el.setAttribute('x', 50 + Math.sin(rad) * r);
    el.setAttribute('y', 50 - Math.cos(rad) * r + 4);
  });
}

// ============================================================
//  GEO LABEL POSITIONS
// ============================================================
function updateGeoLabels() {
  if (appState !== 'hub') return;
  const hw = window.innerWidth / 2, hh = window.innerHeight / 2;
  const container = document.getElementById('labels-container');
  const geoEls = container.querySelectorAll('[data-geo-lat]');
  geoEls.forEach(el => {
    const lat = parseFloat(el.dataset.geoLat);
    const lon = parseFloat(el.dataset.geoLon);
    const p = geoTo3D(lat, lon);
    const v = new THREE.Vector3(p.x, 1, p.z).project(camera);
    if (v.z > 1 || v.z < -1) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    el.style.left = (v.x * hw + hw) + 'px';
    el.style.top = (-v.y * hh + hh) + 'px';
    el.style.transform = 'translate(-50%, -50%)';
  });
}

const TourController = {
  active: false,
  locIdx: 0,
  stepIdx: 0,
  _camFrom: new THREE.Vector3(),
  _camTo:   new THREE.Vector3(),
  _tgtFrom: new THREE.Vector3(),
  _tgtTo:   new THREE.Vector3(),
  _animStartT: -1,
  _animDur: 2.2,
  _typeTimer: null,
  _voiceOn: true,

  start() {
    this.active = true;
    this.locIdx = 0;
    this.stepIdx = 0;
    this._loadLocation();
  },

  _loadLocation() {
    const entry = tourScript[this.locIdx];
    const locData = locations.find(l => l.id === entry.id);
    if (!locData) return;
    const builder = locationBuilders[entry.id];
    if (!builder) return;

    if (appState === 'location') {
      // Transition between immersive locations
      const overlay = document.getElementById('transition-overlay');
      overlay.classList.add('active');
      setTimeout(() => {
        if (locAnimId) { cancelAnimationFrame(locAnimId); locAnimId = null; }
        if (locCleanup) {
          if (locCleanup._onResize) window.removeEventListener('resize', locCleanup._onResize);
          if (locCleanup.dispose) locCleanup.dispose();
          locCleanup = null;
        }
        if (locRenderer) { locRenderer.domElement.remove(); locRenderer.dispose(); locRenderer = null; }
        locScene = null; locCamera = null; locControls = null;
        startImmersiveLocation(locData, builder);
        setTimeout(() => {
          overlay.classList.remove('active');
          this._showStep();
        }, 250);
      }, 480);
    } else {
      // From hub: use normal enterLocation flow
      enterLocation(locations.findIndex(l => l.id === entry.id));
      setTimeout(() => this._showStep(), 900);
    }
  },

  _showStep() {
    const entry = tourScript[this.locIdx];
    const step = entry.steps[this.stepIdx];
    if (!step || !locCamera || !locControls) return;

    // Card
    document.getElementById('tour-card-label').textContent = step.label;
    document.getElementById('tour-card-title').textContent = step.title;
    const textEl = document.getElementById('tour-card-text');
    textEl.textContent = '';
    clearTimeout(this._typeTimer);
    this._typewriter(textEl, step.text);
    this._speak(step.title + '. ' + step.text);

    // Camera lerp setup
    this._camFrom.copy(locCamera.position);
    this._tgtFrom.copy(locControls.target);
    this._camTo.set(...step.cam);
    this._tgtTo.set(...step.target);
    this._animStartT = -1;

    // Disable user orbit during flight
    locControls.enabled = false;
    locControls.autoRotate = false;
    setTimeout(() => {
      if (locControls) { locControls.enabled = true; locControls.autoRotate = true; }
    }, (this._animDur + 0.3) * 1000);

    // Progress
    const totalSteps = tourScript.reduce((s, e) => s + e.steps.length, 0);
    const doneSteps  = tourScript.slice(0, this.locIdx).reduce((s, e) => s + e.steps.length, 0) + this.stepIdx;

      .replace(/\b\w/g, c => c.toUpperCase());
    document.getElementById('tour-counter').textContent =
      `${locName}  ·  step ${this.stepIdx + 1}/${entry.steps.length}  ·  luogo ${this.locIdx + 1}/8`;

    const isLast = this.locIdx === tourScript.length - 1 &&
                   this.stepIdx === entry.steps.length - 1;

      (this.locIdx === 0 && this.stepIdx === 0);
  },

  _typewriter(el, text, idx = 0) {
    if (idx >= text.length) return;
    el.textContent += text[idx];
    this._typeTimer = setTimeout(() => this._typewriter(el, text, idx + 1), 16);
  },

  _speak(text) {
    if (!this._voiceOn) return;
    this._stopSpeech();
    // Tronca testo a max 200 char per chunk (limite endpoint Google TTS)
    const chunks = this._chunkText(text, 190);
    this._audioQueue = chunks;
    this._audioIdx = 0;
    this._playNext();
  },

  _playNext() {
    if (!this._voiceOn || !this._audioQueue || this._audioIdx >= this._audioQueue.length) return;
    const chunk = this._audioQueue[this._audioIdx];
    const url = 'https://translate.google.com/translate_tts?ie=UTF-8' +
      '&q=' + encodeURIComponent(chunk) +
      '&tl=it&client=tw-ob&ttsspeed=0.88';
    const audio = new Audio(url);
    audio.volume = 1.0;
    this._currentAudio = audio;
    audio.onended = () => {
      this._audioIdx++;
      this._playNext();
    };
    audio.onerror = () => {
      // Fallback Web Speech API se Google blocca
      if (window.speechSynthesis) {
        const remaining = this._audioQueue.slice(this._audioIdx).join(' ');
        const utt = new SpeechSynthesisUtterance(remaining);
        utt.lang = 'it-IT'; utt.rate = 0.92;
        const v = speechSynthesis.getVoices().find(x => x.lang.startsWith('it'));
        if (v) utt.voice = v;
        speechSynthesis.speak(utt);
      }
      this._audioQueue = [];
    };
    audio.play().catch(() => { audio.onerror(); });
  },

  _chunkText(text, maxLen) {
    const words = text.split(' ');
    const chunks = [];
    let cur = '';
    for (const w of words) {
      const candidate = cur ? cur + ' ' + w : w;
      if (candidate.length > maxLen) {
        if (cur) chunks.push(cur);
        cur = w;
      } else { cur = candidate; }
    }
    if (cur) chunks.push(cur);
    return chunks;
  },

  _stopSpeech() {
    if (this._currentAudio) {
      this._currentAudio.pause();
      this._currentAudio.src = '';
      this._currentAudio = null;
    }
    this._audioQueue = [];
    if (window.speechSynthesis) speechSynthesis.cancel();
  },

  next() {
    clearTimeout(this._typeTimer);
    this._stopSpeech();
    const entry = tourScript[this.locIdx];
    if (this.stepIdx < entry.steps.length - 1) {
      this.stepIdx++;
      this._showStep();
    } else if (this.locIdx < tourScript.length - 1) {
      this.locIdx++;
      this.stepIdx = 0;
      this._loadLocation();
    } else {
      this.exit();
    }
  },

  prev() {
    clearTimeout(this._typeTimer);
    this._stopSpeech();
    if (this.stepIdx > 0) {
      this.stepIdx--;
      this._showStep();
    } else if (this.locIdx > 0) {
      this.locIdx--;
      this.stepIdx = tourScript[this.locIdx].steps.length - 1;
      this._loadLocation();
    }
  },

  exit() {
    this.active = false;
    clearTimeout(this._typeTimer);
    this._stopSpeech();
    document.getElementById('tour-card').classList.remove('visible');
    document.getElementById('tour-progress-wrap').classList.remove('visible');
    document.getElementById('tour-counter').classList.remove('visible');
    document.getElementById('tour-progress-bar').style.width = '0%';
    if (locControls) { locControls.enabled = true; locControls.autoRotate = true; }
    window.exitLocation();
  },

  update(t) {
    if (!this.active || !locCamera || !locControls) return;
    if (this._animStartT < 0) this._animStartT = t;
    const elapsed = t - this._animStartT;
    if (elapsed < this._animDur) {
      const p = this._ease(elapsed / this._animDur);
      locCamera.position.lerpVectors(this._camFrom, this._camTo, p);
      locControls.target.lerpVectors(this._tgtFrom, this._tgtTo, p);
    }
  },

  _ease(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }
};

// Wire buttons
document.getElementById('tour-start-btn').addEventListener('click', () => {
  document.getElementById('tour-start-btn').classList.add('hidden');
  document.getElementById('tour-card').classList.add('visible');
  document.getElementById('tour-progress-wrap').classList.add('visible');
  document.getElementById('tour-counter').classList.add('visible');
  TourController.start();
});
document.getElementById('tour-next-btn').addEventListener('click', () => TourController.next());
document.getElementById('tour-prev-btn').addEventListener('click', () => TourController.prev());
document.getElementById('tour-exit-btn').addEventListener('click', () => {
  TourController.exit();
  document.getElementById('tour-start-btn').classList.remove('hidden');
});

// Bottone voce narrante
(function() {
  const btn = document.getElementById('tour-voice-btn');
  btn.addEventListener('click', () => {
    TourController._voiceOn = !TourController._voiceOn;
    btn.textContent = TourController._voiceOn ? '🔊' : '🔇';
    btn.classList.toggle('muted', !TourController._voiceOn);
    if (!TourController._voiceOn) TourController._stopSpeech();
  });
})();

window._tourUpdate = t => TourController.update(t);

init();
</script>
</body>
