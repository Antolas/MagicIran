    });
  });

  // ── POINTED ARCHES between column pairs ───────────────────────────────
  function parchArch(x, zA, zB, rotY) {
    const span = Math.abs(zB-zA);
    const cZ = (zA+zB)*0.5;
    const rise = span * 0.72;
    // Build pointed arch as lathe or tube
    const pts = [];
    const N = 32;
    for(let i=0;i<=N;i++){
      const t=i/N;
      // Left half of arch (mirror)
      if(t<=0.5){
        const a=t*2.0;
        const ax=-span/2*(1.0-a)*0.98;
        const ay=rise*(1.0-Math.pow(1.0-a,1.6));
        pts.push(new THREE.Vector3(ax,ay,0));
      } else {
        const a=(t-0.5)*2.0;
        const ax=span/2*a*0.98;
        const ay=rise*(1.0-Math.pow(a,1.6));
        pts.push(new THREE.Vector3(ax,ay,0));
      }
    }
    const curve = new THREE.CatmullRomCurve3(pts,false);
    const archMesh = new THREE.Mesh(
      new THREE.TubeGeometry(curve,60,0.14,8,false),
      new THREE.MeshStandardMaterial({
        color:0x9e7060, roughness:0.78,
        map: null}));
    archMesh.position.set(x, 8.55, cZ);
    if(rotY) archMesh.rotation.y = rotY;
    scene.add(archMesh);
  }
  // Longitudinal arches along each row
  [-4.6,4.6].forEach(x=>{
    parchArch(x,-7,-2,0);
    parchArch(x,-2, 3,0);
  });
  // Cross arches between rows (perpendicular)
  [-7,-2,3].forEach(z=>{
    parchArch(0, z-4.6, z+4.6, Math.PI/2);
  });

  // ── CEILING: barrel‑vaulted with photorealistic muqarnas shader ────────
  const ceilGeo = new THREE.PlaneGeometry(15, 34, 80, 80);
  const ceilVerts = ceilGeo.attributes.position;
  for(let i=0;i<ceilVerts.count;i++){
    const x=ceilVerts.getX(i);
    // Barrel vault curves UP from the sides (convex upward when viewed from below)
    // PlaneGeometry lies in XY, rotated to be ceiling — Z displacement goes outward
    const barrel = -Math.cos(x/7.5*Math.PI)*1.8 + 1.8; // 0 at edges, 3.6 at center
    ceilVerts.setZ(i, barrel);
  }
  ceilGeo.computeVertexNormals();
  const ceilMat = new THREE.ShaderMaterial({
    side: THREE.DoubleSide, uniforms: globalUni,
    vertexShader:`
      varying vec2 vUv; varying vec3 vN; varying vec3 vWP;
      void main(){vUv=uv;vN=normalMatrix*normal;
        vWP=(modelMatrix*vec4(position,1.0)).xyz;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`
      uniform float uTime; varying vec2 vUv; varying vec3 vN; varying vec3 vWP;
      // Tiling hash
      float h3(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
      float n3(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
        return mix(mix(h3(i),h3(i+vec2(1,0)),f.x),mix(h3(i+vec2(0,1)),h3(i+vec2(1,1)),f.x),f.y);}
      void main(){
        // Tile at ~9×22 cells across ceiling
        vec2 uv=vUv*vec2(8.0,20.0);
        vec2 cell=fract(uv)-0.5;
        float r=length(cell);
        float ang=atan(cell.y,cell.x);
        // 8‑pointed star geometry
        float star8=cos(ang*4.0)*0.5+0.5; // 4 maxima = 8-pt star
        float starR=0.22+star8*0.11;
        float starMask=smoothstep(starR+0.025,starR-0.015,r);
        // Interlace octagon border
        float oct=cos(ang*4.0+0.3927)*0.5+0.5;
        float octR=0.38+oct*0.04;
        float octBorder=smoothstep(0.018,0.0,abs(r-octR));
        // Concentric ring details
        float rg1=smoothstep(0.016,0.0,abs(r-0.35));
        float rg2=smoothstep(0.013,0.0,abs(r-0.23));
        float rg3=smoothstep(0.011,0.0,abs(r-0.14));
        // Spokes
        float spokes=smoothstep(0.016,0.0,abs(sin(ang*8.0))*r*0.95);
        float halfSpokes=smoothstep(0.013,0.0,abs(sin(ang*4.0+0.3927))*r*(1.0-smoothstep(0.12,0.16,r)));
        // Cell coloring hash
        float cv=h3(floor(uv));
        // Palette: warm amber/gold base with blue/turquoise accents typical of Qajar plasterwork
        vec3 amber  =vec3(0.52,0.26,0.05);
        vec3 gold   =vec3(0.82,0.62,0.15);
        vec3 cream  =vec3(0.91,0.84,0.68);
        vec3 blue   =vec3(0.11,0.20,0.56);
        vec3 turq   =vec3(0.11,0.54,0.60);
        vec3 rose   =vec3(0.72,0.42,0.48);
        // Base tile
        vec3 c=mix(amber,cream*0.85,0.3+n3(uv*0.5)*0.15);
        // Star fill
        c=mix(c,cv<0.35?cream:cv<0.6?gold:rose,starMask*0.80);
        // Ring accents
        c=mix(c,gold*1.1,rg1*0.90);
        c=mix(c,cv<0.45?blue:turq,rg2*0.70);
        c=mix(c,gold*0.9,rg3*0.65);
        // Outlines
        c=mix(c,amber*0.45,octBorder*0.65);
        c=mix(c,amber*0.4,(spokes+halfSpokes)*0.55);
        // Subtle warm pulsing glow (morning light through windows)
        c+=gold*0.04*sin(uTime*0.35+vWP.z*0.3);
        // Self-shadowing at vault sides
        float side=abs(vUv.x-0.5)*2.0;
        c*=0.72+0.28*(1.0-smoothstep(0.65,1.0,side));
        // Normal‑based shading
        float NdotL=dot(normalize(vN),normalize(vec3(-0.5,1.0,0.3)))*0.5+0.5;
        c*=0.55+NdotL*0.55;
        gl_FragColor=vec4(c,1.0);}` });
  const ceiling = new THREE.Mesh(ceilGeo, ceilMat);
  ceiling.rotation.x = Math.PI/2;
  ceiling.position.set(0, 7.8, -8);
  scene.add(ceiling); animMats.push(ceilMat);

  // Solid dark back plane above vault (close off top)
  const topFill = new THREE.Mesh(
    new THREE.PlaneGeometry(20,40),
    new THREE.MeshBasicMaterial({color:0x120608,side:THREE.DoubleSide}));
  topFill.rotation.x=Math.PI/2;
  topFill.position.set(0,12.0,-8);
  scene.add(topFill);

  // ── WALLS ─────────────────────────────────────────────────────────────
  function buildWall(w,h,pos,rotY){
    const mat = new THREE.ShaderMaterial({side:THREE.DoubleSide,
      vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
      fragmentShader:`varying vec2 vUv;
        float h4(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
        void main(){
          // Dado height: lower 30% = tile mosaic
          float dado=smoothstep(0.285,0.32,vUv.y);
          // Upper wall: rose plaster + geometric incised tracery
          vec3 roseBase=vec3(0.68,0.50,0.44);
          vec2 trUv=vUv*vec2(12.0,9.0);
          vec2 trF=fract(trUv)-0.5;
          float trR=length(trF);
          // Circular medallion grid
          float med=smoothstep(0.016,0.0,abs(trR-0.30));
          // Cross-hatched fine grooves
          float gv=smoothstep(0.012,0.0,abs(trF.x));
          float gh=smoothstep(0.012,0.0,abs(trF.y));
          float diag1=smoothstep(0.012,0.0,abs(trF.x-trF.y));
          float diag2=smoothstep(0.012,0.0,abs(trF.x+trF.y));
          float tracery=(med+(gv+gh)*0.2+(diag1+diag2)*0.1)*0.18;
          vec3 upper=mix(roseBase,vec3(0.88,0.78,0.62),tracery);
          upper*=0.68+0.32*smoothstep(0.0,0.22,min(vUv.x,1.0-vUv.x));
          // Lower dado: fine Islamic zellige tiles
          vec2 tv=vUv*vec2(12.0,4.5);
          vec2 ti=floor(tv); vec2 tf=fract(tv)-0.5;
          float tg=max(smoothstep(0.030,0.006,abs(tf.x)),smoothstep(0.030,0.006,abs(tf.y)));
          float th=h4(ti);
          vec3 tc;
          if(th<0.22)       tc=vec3(0.10,0.30,0.68);
          else if(th<0.42)  tc=vec3(0.10,0.56,0.62);
          else if(th<0.60)  tc=vec3(0.76,0.56,0.10);
          else if(th<0.76)  tc=vec3(0.72,0.16,0.36);
          else              tc=vec3(0.88,0.85,0.72);
          float td=abs(tf.x)+abs(tf.y);
          tc=mix(tc*0.45,tc,smoothstep(0.40,0.28,td));
          tc=mix(tc,vec3(0.04,0.03,0.06),tg*0.65);
          vec3 c=mix(tc,upper,dado);
          gl_FragColor=vec4(c*0.76,1.0);}` });
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h,1,1), mat);
    m.position.copy(pos); m.rotation.y=rotY; scene.add(m);
  }
  buildWall(36,9.5, new THREE.Vector3(-7.5,4.75,-8),  Math.PI/2);
  buildWall(36,9.5, new THREE.Vector3( 7.5,4.75,-8), -Math.PI/2);
  buildWall(16,9.5, new THREE.Vector3(0,4.75,-26),    0);
  buildWall(16,9.5, new THREE.Vector3(0,4.75, 11),    Math.PI);

  // ── STAINED GLASS ARCHED WINDOWS — 5 windows, left wall ──────────────
  // Each window: lower wooden door with geometric coloured panes + upper
  // pointed‑arch rosette window. Closely matches real photos.
  const WIN_DATA = [
    { colors: [[1,0,0],[0,0.7,0.9],[1,0.75,0],[0.2,0.5,1],[0.9,0.2,0.6]] },
    { colors: [[0.9,0.3,0.1],[0,0.65,0.62],[0.95,0.8,0],[0.15,0.3,0.9],[0.8,0.15,0.7]] },
    { colors: [[0.1,0.3,0.9],[1,0.7,0],[0.9,0.1,0.2],[0.1,0.7,0.3],[0.9,0.5,0.1]] },
    { colors: [[0.8,0.15,0.65],[0.95,0.75,0],[0.1,0.55,0.65],[0.9,0.2,0.15],[0.15,0.5,0.2]] },
    { colors: [[1,0.1,0.18],[0.15,0.62,0.35],[0.9,0.6,0],[0.1,0.28,0.85],[0.85,0.4,0.1]] },
  ];

  for(let wi=0;wi<5;wi++){
    const wZ = (wi-2)*5.2 - 5.5;
    const wX = -7.46;
    const WW = 2.4, WH = 4.2;

    // ── LOWER PANE GRID (wooden frame + 3×4 coloured glass panes) ──
    const lowerH = WH * 0.56;
    const cols = WIN_DATA[wi].colors;
    const paneW = WW/3, paneH = lowerH/4;
    for(let row=0;row<4;row++){
      for(let col=0;col<3;col++){
        const c=cols[(row+col)%5];
        const pUni={uTime:{value:0},uC:{value:new THREE.Vector3(c[0],c[1],c[2])},uWi:{value:wi}};
        const pMat=new THREE.ShaderMaterial({
          transparent:true, side:THREE.DoubleSide, uniforms:pUni,
          vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
          fragmentShader:`
            uniform float uTime; uniform vec3 uC; uniform float uWi;
            varying vec2 vUv;
            void main(){
              // Circular rosette pattern inside each pane
              vec2 uv=vUv-0.5;
              float r=length(uv); float ang=atan(uv.y,uv.x);
              float petals=abs(sin(ang*6.0))*0.5+0.5;
              float ring=smoothstep(0.016,0.0,abs(r-0.32));
              float ring2=smoothstep(0.012,0.0,abs(r-0.20));
              float spk=smoothstep(0.015,0.0,abs(sin(ang*6.0))*r*0.85);
              vec3 c2=uC;
              // Lighter petal fills
              c2=mix(c2,uC*1.4+0.1,petals*smoothstep(0.20,0.05,r)*0.5);
              // Dark lead lines
              c2=mix(c2,vec3(0.04,0.03,0.02),(ring+ring2+spk)*0.80);
              // Edge lead strip
              float edge=1.0-smoothstep(0.0,0.045,min(min(vUv.x,1.0-vUv.x),min(vUv.y,1.0-vUv.y)));
              c2=mix(c2,vec3(0.05,0.04,0.03),edge*0.85);
              // Glow animation
              float glw=0.85+0.15*sin(uTime*0.5+uWi*1.3+float(int(uWi))*0.7);
              c2*=glw;
              float a=(1.0-edge)*0.93;
              gl_FragColor=vec4(c2,a);}` });
        const pm=new THREE.Mesh(
          new THREE.PlaneGeometry(paneW-0.06,paneH-0.05),pMat);
        pm.position.set(
          wX, 0.35+paneH*0.5+row*paneH, wZ+(-1+col)*paneW+paneW*0.5);
        pm.rotation.y=Math.PI/2;
        scene.add(pm); windowAnimMats.push(pMat);
      }
    }

    // ── UPPER ARCH ROSETTE WINDOW ────────────────────────────────────
    const upperBase = 0.35 + lowerH;
    const archShape = new THREE.Shape();
    archShape.moveTo(-WW/2, 0);
    archShape.lineTo(-WW/2, WH*0.55);
    archShape.quadraticCurveTo(-WW*0.36, WH*0.98, 0, WH*0.46);
    archShape.quadraticCurveTo( WW*0.36, WH*0.98, WW/2, WH*0.55);
    archShape.lineTo(WW/2, 0);
    archShape.closePath();
    const archGeo=new THREE.ShapeGeometry(archShape,40);
    const ac=cols[0];
    const aUni={uTime:{value:0},uWi:{value:wi},
      uC0:{value:new THREE.Vector3(ac[0],ac[1],ac[2])},
      uC1:{value:new THREE.Vector3(cols[1][0],cols[1][1],cols[1][2])},
      uC2:{value:new THREE.Vector3(cols[2][0],cols[2][1],cols[2][2])}};
    const archMat=new THREE.ShaderMaterial({
      transparent:true, side:THREE.DoubleSide, uniforms:aUni,
      vertexShader:`varying vec2 vPos;void main(){vPos=position.xy;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
      fragmentShader:`
        uniform float uTime; uniform float uWi;
        uniform vec3 uC0,uC1,uC2;
        varying vec2 vPos;
        #define WW ${WW.toFixed(2)}
        #define WH ${(WH*0.46).toFixed(2)}
        void main(){
          vec2 uv=vec2(vPos.x/WW*0.5+0.5, vPos.y/WH);
          vec2 cen=uv-vec2(0.5,0.3);
          float ang=atan(cen.y,cen.x);
          float rad=length(cen)*1.6;
          // 12-petal rosette
          float pet12=cos(ang*6.0)*0.5+0.5;
          float pet8=cos(ang*4.0)*0.5+0.5;
          // Concentric rings with spokes
          float rg1=smoothstep(0.016,0.0,abs(rad-0.52));
          float rg2=smoothstep(0.013,0.0,abs(rad-0.36));
          float rg3=smoothstep(0.010,0.0,abs(rad-0.22));
          float rg4=smoothstep(0.010,0.0,abs(rad-0.10));
          float spk12=smoothstep(0.018,0.0,abs(sin(ang*12.0))*rad*0.8);
          float spk6=smoothstep(0.016,0.0,abs(sin(ang*6.0))*rad*(1.0-smoothstep(0.14,0.22,rad)));
          // Segment colors
          float segI=floor(mod((ang/6.2832+0.5)*12.0,12.0));
          vec3 sc=mod(segI,3.0)<1.0?uC0:mod(segI,3.0)<2.0?uC1:uC2;
          // Base field: petal-driven mix
          vec3 col=mix(uC1,uC0,pet12*(1.0-smoothstep(0.20,0.42,rad)));
          col=mix(col,uC2,pet8*smoothstep(0.18,0.36,rad)*0.6);
          col=mix(col,sc,smoothstep(0.36,0.46,rad));
          col=mix(col,uC0*1.4,smoothstep(0.12,0.0,rad)); // bright centre
          // Lead lines (dark)
          float lead=rg1+rg2+rg3+rg4+spk12+spk6;
          col=mix(col,vec3(0.04,0.03,0.02),min(lead,1.0)*0.78);
          float glw=0.88+0.12*sin(uTime*0.48+uWi*1.7);
          col*=glw*1.3;
          float edge=1.0-smoothstep(0.0,0.035,min(uv.x,1.0-uv.x));
          gl_FragColor=vec4(col,max(0.0,1.0-edge)*0.92);}` });
    const archMesh=new THREE.Mesh(archGeo,archMat);
    archMesh.position.set(wX, upperBase, wZ);
    archMesh.rotation.y=Math.PI/2;
    scene.add(archMesh); windowAnimMats.push(archMat);

    // Arch frame (dark wood)
    const fc=new THREE.CatmullRomCurve3([
      new THREE.Vector3(-WW/2,0,0),
      new THREE.Vector3(-WW/2,WH*0.3,0),
      new THREE.Vector3(-WW*0.32,WH*0.44,0),
      new THREE.Vector3(0,WH*0.46*1.02,0),
      new THREE.Vector3( WW*0.32,WH*0.44,0),
      new THREE.Vector3( WW/2,WH*0.3,0),
      new THREE.Vector3( WW/2,0,0),
    ],false);
    const fMesh=new THREE.Mesh(
      new THREE.TubeGeometry(fc,48,0.055,8,false),
      new THREE.MeshStandardMaterial({color:0x2a1008,roughness:0.7}));
    fMesh.position.set(wX,upperBase,wZ);
    fMesh.rotation.y=Math.PI/2; scene.add(fMesh);

    // Vertical door frame
    [[-WW/2+0.03],[WW/2-0.03]].forEach(([dx])=>{
      const vm=new THREE.Mesh(
        new THREE.BoxGeometry(0.065,lowerH+0.05,0.065),
        new THREE.MeshStandardMaterial({color:0x2a1008}));
      vm.position.set(wX,0.35+lowerH/2,wZ+dx);
      vm.rotation.y=Math.PI/2; scene.add(vm);
    });

    // Colored lights from each window
    const lc=new THREE.Color(ac[0],ac[1],ac[2]);
    const wLt=new THREE.PointLight(lc,4.0,16,1.6);
    wLt.position.set(-5.0,4.0,wZ); scene.add(wLt);
    const fLt=new THREE.PointLight(lc,2.5,10,2.0);
    fLt.position.set(-1.5,0.12,wZ); scene.add(fLt);
  }

  // ── LIGHT RAYS (additive volumetric cones) ───────────────────────────
  const rayColors=[0xe91e63,0xffa726,0x2196f3,0x26c6da,0xf06292];
  for(let ri=0;ri<5;ri++){
    const rZ=(ri-2)*5.2-5.5;
    // Wide cone
    const rm1=new THREE.MeshBasicMaterial({
      color:rayColors[ri],transparent:true,opacity:0.048,
      blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
    const ray=new THREE.Mesh(new THREE.CylinderGeometry(0.04,3.5,11,6,1,true),rm1);
    ray.position.set(-2.8,2.6,rZ); ray.rotation.z=-Math.PI/2.2; scene.add(ray);
    // Narrow bright inner ray
    const rm2=new THREE.MeshBasicMaterial({
      color:rayColors[ri],transparent:true,opacity:0.11,
      blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
    const ray2=new THREE.Mesh(new THREE.CylinderGeometry(0.02,1.0,8,5,1,true),rm2);
    ray2.position.set(-3.5,3.2,rZ); ray2.rotation.z=-Math.PI/2.2; scene.add(ray2);
  }

  // ── FLOOR STAINED-GLASS PROJECTIONS ──────────────────────────────────
  for(let fi=0;fi<5;fi++){
    const fZ=(fi-2)*5.2-5.5;
    const fUni={uTime:{value:0},uIdx:{value:fi}};
    const fMat=new THREE.ShaderMaterial({
      side:THREE.FrontSide,transparent:true,depthWrite:false,
      blending:THREE.AdditiveBlending, uniforms:fUni,
      vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
      fragmentShader:`
        uniform float uTime; uniform float uIdx; varying vec2 vUv;
        void main(){
          float pulse=0.70+0.30*sin(uTime*0.42+uIdx*2.0);
          // Pane grid shadow
          vec2 g=fract(vUv*vec2(3.0,5.0));
          float gL=max(smoothstep(0.07,0.018,abs(g.x-0.5)),smoothstep(0.07,0.018,abs(g.y-0.5)));
          // Radial rosette
          vec2 c2=(vUv-vec2(0.3,0.78))*vec2(1.0,0.5);
          float rr=length(c2); float aa=atan(c2.y,c2.x);
          float rad=sin(aa*6.0+uTime*0.32)*0.5+0.5;
          float rm=smoothstep(0.4,0.0,rr);
          // Per-window palette
          vec3 pals[5];
          pals[0]=vec3(0.90,0.08,0.18); pals[1]=vec3(0.95,0.65,0.03);
          pals[2]=vec3(0.08,0.28,0.90); pals[3]=vec3(0.08,0.70,0.30);
          pals[4]=vec3(0.88,0.30,0.68);
          int ci=int(mod(uIdx,5.0));
          vec3 bc;
          if(ci==0)bc=pals[0]; else if(ci==1)bc=pals[1];
          else if(ci==2)bc=pals[2]; else if(ci==3)bc=pals[3]; else bc=pals[4];
          float bright=(rad*rm*0.60+(1.0-gL)*0.40)*pulse;
          float ef=smoothstep(0.0,0.12,min(min(vUv.x,1.0-vUv.x),min(vUv.y,1.0-vUv.y)));
          gl_FragColor=vec4(bc*bright,bright*ef*0.28);
        }`});
    const projMesh=new THREE.Mesh(new THREE.PlaneGeometry(6,7),fMat);
    projMesh.rotation.x=-Math.PI/2;
    projMesh.position.set(-1.5,0.04,fZ);
    scene.add(projMesh); windowAnimMats.push(fMat);
  }

  // ── DUST MOTES floating in light beams ───────────────────────────────
  const DN=800; const dPos=new Float32Array(DN*3); const dSz=new Float32Array(DN);
  for(let i=0;i<DN;i++){
    dPos[i*3  ]=(Math.random()-0.5)*14;
    dPos[i*3+1]= Math.random()*8.5;
    dPos[i*3+2]=(Math.random()-0.5)*32-8;
    dSz[i]=Math.random()*2.0+0.5;
  }
  const dGeo=new THREE.BufferGeometry();
  dGeo.setAttribute('position',new THREE.BufferAttribute(dPos,3));
  dGeo.setAttribute('size',new THREE.BufferAttribute(dSz,1));
  const dUni={uTime:{value:0}};
  const dMat=new THREE.ShaderMaterial({
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:dUni,
    vertexShader:`
      attribute float size; uniform float uTime; varying float vA;
      void main(){
        vec3 p=position;
        p.y+=sin(uTime*0.24+position.x*1.9+position.z*0.4)*0.55;
        p.x+=cos(uTime*0.17+position.z*0.5)*0.32;
        p.z+=sin(uTime*0.12+position.x*0.7)*0.20;
        vec4 mv=modelViewMatrix*vec4(p,1.0);
        gl_PointSize=size*(96.0/-mv.z);
        gl_Position=projectionMatrix*mv;
        float wp=smoothstep(4.0,-6.0,p.x)*smoothstep(0.0,3.5,p.y);
        vA=(0.10+wp*0.6)*smoothstep(280.0,8.0,-mv.z);}`,
    fragmentShader:`
      varying float vA;
      void main(){
        float d=length(gl_PointCoord-0.5);
        gl_FragColor=vec4(1.0,0.90,0.72,smoothstep(0.5,0.08,d)*vA);}` });
  scene.add(new THREE.Points(dGeo,dMat));

  // ── UPDATE + DISPOSE ──────────────────────────────────────────────────
  return {
    update(t){
      globalUni.uTime.value=t; dUni.uTime.value=t;
      windowAnimMats.forEach(m=>{if(m.uniforms&&m.uniforms.uTime)m.uniforms.uTime.value=t;});
    },
    dispose(){}
  };
};

// ============================================================
//  PERSEPOLIS — Ancient Achaemenid ruins at golden hour
// ============================================================
locationBuilders['persepolis'] = function(scene, camera, controls) {
  camera.position.set(0, 3.5, 18);
  controls.target.set(0, 4, 0);
  controls.minDistance = 1; controls.maxDistance = 40;
  controls.maxPolarAngle = Math.PI*0.82; controls.minPolarAngle = Math.PI*0.05;
  controls.autoRotateSpeed = 0.08;
  if(locRenderer){ locRenderer.toneMapping=THREE.ACESFilmicToneMapping; locRenderer.toneMappingExposure=1.2; }

  const uni={uTime:{value:0}};
  // Sky gradient: deep orange horizon → amber → deep blue zenith
  const skyGeo=new THREE.SphereGeometry(80,32,16);
  const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,uniforms:uni,
    vertexShader:`varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`uniform float uTime;varying vec3 vP;
      void main(){
        float h=normalize(vP).y;
        vec3 horizon=vec3(0.92,0.42,0.08);
        vec3 mid=vec3(0.75,0.28,0.04);
        vec3 zenith=vec3(0.18,0.12,0.32);
        vec3 c=h<0.0?mix(horizon,vec3(0.38,0.15,0.04),clamp(-h*3.0,0.0,1.0)):
                h<0.18?mix(horizon,mid,h/0.18):
                mix(mid,zenith,(h-0.18)/0.82);
        // Haze
        c=mix(c,vec3(0.82,0.52,0.22),smoothstep(0.3,0.0,h)*0.45);
        gl_FragColor=vec4(c,1.0);}`});
  scene.add(new THREE.Mesh(skyGeo,skyMat));

  // Sun disc
  const sunGeo=new THREE.SphereGeometry(2.0,16,8);
  const sunMat=new THREE.MeshBasicMaterial({color:0xffaa44});
  const sun=new THREE.Mesh(sunGeo,sunMat);
  sun.position.set(-35,18,-60); scene.add(sun);

  // Lighting
  scene.add(new THREE.AmbientLight(0x7a4010,0.8));
  const sunLight=new THREE.DirectionalLight(0xffcc66,2.5);
  sunLight.position.set(-3,4,-5); scene.add(sunLight);
  scene.add(new THREE.HemisphereLight(0xff8822,0x1a0c04,0.4));

  // Canvas texture helpers for Persepolis
  function mkTexP(w,h,fn){
    const c=document.createElement('canvas');c.width=w;c.height=h;
    fn(c.getContext('2d'),w,h);
    const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
  }

  // Achaemenid limestone — large dressed blocks with chisel marks and weathering
  const _platTex=mkTexP(1024,1024,(ctx,W,H)=>{
    ctx.fillStyle='#c8a870';ctx.fillRect(0,0,W,H);
    const cols=5,rows=5,tw=W/cols,th=H/rows;
    for(let r=0;r<rows;r++) for(let c2=0;c2<cols;c2++){
      const x=c2*tw,y=r*th,sd=r*7+c2*13;
      const v=0.78+(Math.abs(Math.sin(sd*3.7)))*0.22;
      ctx.fillStyle=`rgb(${Math.round(200*v)},${Math.round(158*v)},${Math.round(105*v)})`;
      ctx.fillRect(x+2,y+2,tw-4,th-4);
      ctx.save();ctx.strokeStyle=`rgba(110,78,40,0.20)`;ctx.lineWidth=0.9;
      for(let li=0;li<9;li++){const ly=y+4+li*(th-8)/9;ctx.beginPath();ctx.moveTo(x+3,ly);ctx.lineTo(x+tw-3+(Math.sin(sd*li*0.9)-0.5)*6,ly+(Math.cos(sd*li*1.3)-0.5)*th*0.05);ctx.stroke();}
      for(let pi=0;pi<3;pi++){const px=x+(Math.abs(Math.sin(sd*pi*2.3)))*tw;const py=y+(Math.abs(Math.cos(sd*pi*1.9)))*th;ctx.beginPath();ctx.ellipse(px,py,tw*0.09+Math.abs(Math.sin(sd*pi))*tw*0.10,th*0.07,Math.PI*0.3+pi*0.8,0,Math.PI*2);ctx.fillStyle=`rgba(155,112,65,${0.10+Math.abs(Math.sin(sd*pi*1.1))*0.11})`;ctx.fill();}
      ctx.restore();
    }
    ctx.strokeStyle='rgba(75,50,24,0.62)';ctx.lineWidth=3.5;
    for(let i=0;i<=cols;i++){ctx.beginPath();ctx.moveTo(i*tw,0);ctx.lineTo(i*tw,H);ctx.stroke();}
    for(let i=0;i<=rows;i++){ctx.beginPath();ctx.moveTo(0,i*th);ctx.lineTo(W,i*th);ctx.stroke();}
  });

  // Persepolis procession frieze — Achaemenid relief style
  const _friezeTex=mkTexP(1024,256,(ctx,W,H)=>{
    ctx.fillStyle='#c8a870';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#b89050';ctx.fillRect(0,0,W,22);ctx.fillRect(0,H-22,W,22);
    ctx.fillStyle='rgba(80,54,22,0.30)';ctx.fillRect(0,20,W,4);ctx.fillRect(0,H-24,W,4);
    const figW=52,nFig=Math.floor(W/figW),figY=H*0.18,figH=H*0.70;
    for(let fi=0;fi<nFig;fi++){
      const fx=fi*figW+figW*0.5,sd=fi*7+1;
      ctx.save();ctx.fillStyle='rgba(105,70,35,0.85)';
      ctx.beginPath();ctx.moveTo(fx-figW*0.18,figY+figH*0.28);ctx.lineTo(fx-figW*0.14,figY+figH*0.02);ctx.lineTo(fx+figW*0.12,figY+figH*0.06);ctx.lineTo(fx+figW*0.16,figY+figH*0.32);ctx.lineTo(fx+figW*0.14,figY+figH*0.66);ctx.lineTo(fx-figW*0.10,figY+figH*0.72);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.arc(fx-figW*0.03,figY-figH*0.05,figW*0.11,0,Math.PI*2);ctx.fill();
      if(fi%2===0){ctx.beginPath();ctx.arc(fx-figW*0.03,figY-figH*0.13,figW*0.09,Math.PI,Math.PI*2);ctx.fill();}
      else{ctx.fillRect(fx-figW*0.10,figY-figH*0.27,figW*0.13,figH*0.15);}
      ctx.beginPath();ctx.moveTo(fx-figW*0.13,figY+figH*0.22);ctx.lineTo(fx+figW*0.26,figY+figH*0.16);
      ctx.lineWidth=3.5;ctx.strokeStyle='rgba(105,70,35,0.82)';ctx.stroke();
      if(fi%3===0){ctx.beginPath();ctx.moveTo(fx+figW*0.22,figY-figH*0.22);ctx.lineTo(fx+figW*0.22,figY+figH*0.70);ctx.lineWidth=3;ctx.stroke();ctx.beginPath();ctx.moveTo(fx+figW*0.14,figY-figH*0.18);ctx.lineTo(fx+figW*0.22,figY-figH*0.30);ctx.lineTo(fx+figW*0.30,figY-figH*0.18);ctx.closePath();ctx.fill();}
      ctx.strokeStyle='rgba(88,55,22,0.30)';ctx.lineWidth=0.9;
      for(let pl=0;pl<5;pl++){const px=fx-figW*0.10+pl*figW*0.052;ctx.beginPath();ctx.moveTo(px,figY+figH*0.34);ctx.lineTo(px+(Math.sin(pl*sd*0.5)-0.5)*3,figY+figH*0.70);ctx.stroke();}
      ctx.restore();
    }
    const grd=ctx.createLinearGradient(0,0,W,0);grd.addColorStop(0,'rgba(0,0,0,0)');grd.addColorStop(0.5,'rgba(255,228,155,0.055)');grd.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
  });

  // Fluted column stone
  const _colTex=mkTexP(256,512,(ctx,W,H)=>{
    ctx.fillStyle='#c8a872';ctx.fillRect(0,0,W,H);
    const nF=20,fw=W/nF;
    for(let f=0;f<nF;f++){
      const x=f*fw;
      const grd=ctx.createLinearGradient(x,0,x+fw,0);
      grd.addColorStop(0,'rgba(148,112,65,0.72)');grd.addColorStop(0.28,'rgba(205,165,110,0.10)');grd.addColorStop(0.5,'rgba(218,178,116,0.0)');grd.addColorStop(0.72,'rgba(205,165,110,0.10)');grd.addColorStop(1,'rgba(148,112,65,0.72)');
      ctx.fillStyle=grd;ctx.fillRect(x,0,fw,H);
    }
    for(let li=0;li<H;li+=8){ctx.fillStyle=`rgba(118,88,48,${0.040+(Math.abs(Math.sin(li*0.17)))*0.040})`;ctx.fillRect(0,li,W,2);}
    ctx.fillStyle='rgba(100,72,42,0.12)';
    [[40,105,28,18],[W-58,252,36,26],[82,382,24,16]].forEach(([px,py,pw,ph])=>{ctx.beginPath();ctx.ellipse(px,py,pw,ph,Math.PI*0.3,0,Math.PI*2);ctx.fill();});
  });

  // Stone platform (terrace of Persepolis)
  const plat=new THREE.Mesh(new THREE.PlaneGeometry(80,80),
    new THREE.MeshStandardMaterial({map:_platTex,roughness:0.82,metalness:0.0}));
  _platTex.repeat.set(5,5);
  plat.rotation.x=-Math.PI/2; plat.position.y=0; scene.add(plat);

  // Stone staircase
  for(let step=0;step<12;step++){
    const s=new THREE.Mesh(new THREE.BoxGeometry(14,0.22,0.65),
      new THREE.MeshStandardMaterial({color:0xb8966a,roughness:0.9}));
    s.position.set(0,step*0.22,14-step*0.65); scene.add(s);
  }

  // Achaemenid relief panel
  const rel=new THREE.Mesh(new THREE.PlaneGeometry(14,2.2),
    new THREE.MeshStandardMaterial({map:_friezeTex,roughness:0.80,metalness:0.0}));
  rel.position.set(0,1.1,14.1); scene.add(rel);

  // Columns with canvas fluted stone texture
  const heights=[22,22,22,22,20,22,22,21];
  const broken=[false,false,false,false,true,false,false,false];
  [-1,1].forEach(side=>{
    heights.forEach((h2,i)=>{
      const g=new THREE.Group();
      const ht=broken[i]?h2*0.55:h2;
      // Shaft — canvas fluted texture
      const colT=_colTex.clone();colT.repeat.set(1,Math.ceil(ht/2));
      const sh=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.38,ht,20),
        new THREE.MeshStandardMaterial({map:colT,roughness:0.72,metalness:0.02}));
      sh.position.y=ht/2; g.add(sh);
      if(!broken[i]){
        // Bell capital
        const cap=new THREE.Mesh(new THREE.CylinderGeometry(1.1,0.36,1.5,12),
          new THREE.MeshStandardMaterial({color:0xb89a70,roughness:0.8}));
        cap.position.y=h2+0.75; g.add(cap);
        // Bull protome (simplified)
        const bull=new THREE.Mesh(new THREE.BoxGeometry(2.0,0.8,1.2),
          new THREE.MeshStandardMaterial({color:0xb89a70,roughness:0.8}));
        bull.position.y=h2+1.9; g.add(bull);
      }
      // Base drum
      const base=new THREE.Mesh(new THREE.CylinderGeometry(0.52,0.55,0.7,16),
        new THREE.MeshStandardMaterial({color:0x9a8060,roughness:0.9}));
      base.position.y=0.35; g.add(base);
      g.position.set(side*3.5,0,-i*3.6+10);
      scene.add(g);
    });
  });

  // Distant mountains silhouette
  for(let mi=0;mi<18;mi++){
    const mh=6+Math.random()*12;
    const mw=12+Math.random()*20;
    const mg=new THREE.ConeGeometry(mw/2,mh,6);
    const mm=new THREE.MeshBasicMaterial({color:new THREE.Color(0.22,0.12,0.06)});
    const mt=new THREE.Mesh(mg,mm);
    const angle=mi/18*Math.PI*2;
    mt.position.set(Math.sin(angle)*65,mh/2-1,Math.cos(angle)*65);
    scene.add(mt);
  }

  // Fallen column drums scattered on ground
  [-2,3,-5].forEach((x,i)=>{
    const drum=new THREE.Mesh(new THREE.CylinderGeometry(0.38,0.38,0.7,12),
      new THREE.MeshStandardMaterial({color:0xa08060,roughness:0.95}));
    drum.rotation.z=Math.PI/2+i*0.3;
    drum.position.set(x*2,0.35,8-i*2); scene.add(drum);
  });

  // Dust particles
  const DN=400,dP=new Float32Array(DN*3),dS=new Float32Array(DN);
  for(let i=0;i<DN;i++){dP[i*3]=(Math.random()-0.5)*40;dP[i*3+1]=Math.random()*6;dP[i*3+2]=(Math.random()-0.5)*40;dS[i]=Math.random()*2+0.5;}
  const dGeo=new THREE.BufferGeometry();
  dGeo.setAttribute('position',new THREE.BufferAttribute(dP,3));
  dGeo.setAttribute('size',new THREE.BufferAttribute(dS,1));
  const dUni={uTime:{value:0}};
  scene.add(new THREE.Points(dGeo,new THREE.ShaderMaterial({
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:dUni,
    vertexShader:`attribute float size;uniform float uTime;varying float vA;
      void main(){vec3 p=position;p.x+=sin(uTime*0.1+p.z)*0.5;p.y+=cos(uTime*0.12+p.x)*0.2;
        vec4 mv=modelViewMatrix*vec4(p,1.0);gl_PointSize=size*(60.0/-mv.z);gl_Position=projectionMatrix*mv;
        vA=0.08*smoothstep(200.0,5.0,-mv.z);}`,
    fragmentShader:`varying float vA;void main(){float d=length(gl_PointCoord-0.5);gl_FragColor=vec4(0.90,0.70,0.40,smoothstep(0.5,0.1,d)*vA);}`})));

  return{update(t){uni.uTime.value=t;dUni.uTime.value=t;},dispose(){}};
};

// ============================================================
//  NAQSH-E JAHAN — Isfahan grand square
// ============================================================
locationBuilders['naqsh-e-jahan'] = function(scene, camera, controls) {
  camera.position.set(0, 5, 42);
  controls.target.set(0, 6, 0);
  controls.minDistance=1;controls.maxDistance=65;
  controls.maxPolarAngle=Math.PI*0.78;controls.minPolarAngle=Math.PI*0.04;
  controls.autoRotateSpeed=0.08;
  if(locRenderer){locRenderer.toneMapping=THREE.ACESFilmicToneMapping;locRenderer.toneMappingExposure=1.15;}

  const uni={uTime:{value:0}};

  // ── CANVAS TEXTURE GENERATORS ───────────────────────────────────────────
  function mkTex(w,h,fn){
    const c=document.createElement('canvas');c.width=w;c.height=h;
    fn(c.getContext('2d'),w,h);
    const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;
    return t;
  }

  // 8-pointed star (hasht-par) — classic Persian zellige
  function starTile(W=512,H=512){
    return mkTex(W,H,(ctx)=>{
      ctx.fillStyle='#0b2468';ctx.fillRect(0,0,W,H);
      const N=2, tw=W/N;
      for(let row=0;row<N;row++) for(let col=0;col<N;col++){
        const cx=col*tw+tw/2, cy=row*tw+tw/2, R=tw*0.44, ri=R*0.40;
        // outer star fill
        ctx.beginPath();
        for(let i=0;i<16;i++){
          const a=i*Math.PI/8-(Math.PI/16);
          const r2=i%2===0?R:ri;
          i===0?ctx.moveTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2)
               :ctx.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2);
        }
        ctx.closePath();ctx.fillStyle='#1452c0';ctx.fill();
        // gold outline
        ctx.strokeStyle='#c8920a';ctx.lineWidth=3;ctx.stroke();
        // center turquoise octagon
        ctx.beginPath();
        for(let i=0;i<8;i++){
          const a=i*Math.PI/4;
          i===0?ctx.moveTo(cx+Math.cos(a)*R*0.30,cy+Math.sin(a)*R*0.30)
               :ctx.lineTo(cx+Math.cos(a)*R*0.30,cy+Math.sin(a)*R*0.30);
        }
        ctx.closePath();ctx.fillStyle='#06a8b8';ctx.fill();
        ctx.strokeStyle='#e0b020';ctx.lineWidth=2;ctx.stroke();
        // center dot
        ctx.beginPath();ctx.arc(cx,cy,R*0.10,0,Math.PI*2);
        ctx.fillStyle='#f0c828';ctx.fill();
        // corner diamond fillers (where 4 stars meet)
        [[0,0],[tw,0],[0,tw],[tw,tw]].forEach(([ox,oy])=>{
          ctx.save();ctx.translate(col*tw+ox,row*tw+oy);ctx.rotate(Math.PI/4);
          ctx.fillStyle='#0872a0';
          ctx.fillRect(-R*0.14,-R*0.14,R*0.28,R*0.28);
          ctx.strokeStyle='#d4a010';ctx.lineWidth=1.5;ctx.strokeRect(-R*0.14,-R*0.14,R*0.28,R*0.28);
          ctx.restore();
        });
        // half-stars at edges (cross-shaped interstice)
        [[cx,row*tw],[cx,(row+1)*tw],[col*tw,cy],[(col+1)*tw,cy]].forEach(([ex,ey])=>{
          ctx.beginPath();ctx.arc(ex,ey,R*0.22,0,Math.PI*2);
          ctx.fillStyle='#1060c8';ctx.fill();
          ctx.strokeStyle='#b88008';ctx.lineWidth=1.5;ctx.stroke();
        });
      }
      // grout overlay
      ctx.strokeStyle='rgba(2,6,20,0.75)';ctx.lineWidth=2.5;
      for(let i=0;i<=N;i++){
        ctx.beginPath();ctx.moveTo(i*tw,0);ctx.lineTo(i*tw,H);ctx.stroke();
        ctx.beginPath();ctx.moveTo(0,i*tw);ctx.lineTo(W,i*tw);ctx.stroke();
      }
    });
  }

  // Travertine stone paving — Isfahan courtyard
  function stonePave(){
    return mkTex(1024,1024,(ctx,W,H)=>{
      ctx.fillStyle='#cbbf9e';ctx.fillRect(0,0,W,H);
      const cols=6,rows=6,tw=W/cols,th=H/rows;
      for(let rr=0;rr<rows;rr++) for(let cc=0;cc<cols;cc++){
        const x=cc*tw,y=rr*th;
        const seed=rr*17+cc*31;
        const v=0.82+((Math.sin(seed*7.3)*0.5+0.5))*0.22;
        const r2=Math.round(203*v),g2=Math.round(191*v),b2=Math.round(158*v);
        ctx.fillStyle=`rgb(${r2},${g2},${b2})`;
        ctx.fillRect(x+2,y+2,tw-4,th-4);
        // veins
        ctx.save();ctx.strokeStyle=`rgba(148,136,112,0.40)`;ctx.lineWidth=1.2;
        for(let vi=0;vi<5;vi++){
          const s2=seed*10+vi;
          const sx=x+(Math.sin(s2*3.7)*0.5+0.5)*tw;
          const sy=y+(Math.cos(s2*4.1)*0.5+0.5)*th;
          ctx.beginPath();ctx.moveTo(sx,sy);
          ctx.bezierCurveTo(
            sx+(Math.sin(s2*2.9)-0.5)*tw*0.5,sy+(Math.cos(s2*3.3)-0.5)*th*0.5,
            sx+(Math.sin(s2*5.1)-0.5)*tw*0.7,sy+(Math.cos(s2*4.7)-0.5)*th*0.7,
            sx+(Math.sin(s2*1.7)-0.5)*tw,    sy+(Math.cos(s2*2.3)-0.5)*th);
          ctx.stroke();
        }
        ctx.restore();
      }
      // grout lines
      ctx.strokeStyle='rgba(88,76,58,0.55)';ctx.lineWidth=4;
      for(let i=0;i<=cols;i++){ctx.beginPath();ctx.moveTo(i*tw,0);ctx.lineTo(i*tw,H);ctx.stroke();}
      for(let i=0;i<=rows;i++){ctx.beginPath();ctx.moveTo(0,i*th);ctx.lineTo(W,i*th);ctx.stroke();}
    });
  }

  // Dome mosaic — concentric arabesque medallion
  function domeMosaic(){
    return mkTex(1024,1024,(ctx,W,H)=>{
      // mosaic tile grid with distance-based hue
      const ts=16;
      for(let rr=0;rr<H;rr+=ts) for(let cc=0;cc<W;cc+=ts){
        const dx=cc-W/2,dy=rr-H/2;
        const ang=Math.atan2(dy,dx);
        const d=Math.sqrt(dx*dx+dy*dy)/(W/2);
        const hue=192+Math.sin(ang*8)*14+d*30;
        const sat=62+d*20;
        const lum=22+d*18;
        ctx.fillStyle=`hsl(${hue},${sat}%,${lum}%)`;
        ctx.fillRect(cc+0.6,rr+0.6,ts-1.2,ts-1.2);
      }
      // gold arabesque rings (rotated octagons)
      ctx.strokeStyle='rgba(210,164,8,0.80)';
      for(let i=1;i<=12;i++){
        const r2=i/12*W*0.47;
        ctx.lineWidth=i%3===0?3:1.5;
        ctx.save();ctx.translate(W/2,H/2);ctx.rotate(i*Math.PI/12);
        ctx.beginPath();
        for(let j=0;j<8;j++){
          const a=j*Math.PI/4;
          j===0?ctx.moveTo(Math.cos(a)*r2,Math.sin(a)*r2):ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);
        }
        ctx.closePath();ctx.stroke();
        ctx.restore();
      }
      // radial spokes
      ctx.strokeStyle='rgba(185,142,5,0.35)';ctx.lineWidth=1;
      for(let a=0;a<Math.PI*2;a+=Math.PI/8){
        ctx.save();ctx.translate(W/2,H/2);
        ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*W*0.5,Math.sin(a)*W*0.5);
        ctx.stroke();ctx.restore();
      }
      // central 16-point star medallion
      ctx.save();ctx.translate(W/2,H/2);
      ctx.beginPath();
      for(let i=0;i<16;i++){
        const a=i*Math.PI/8;
        const r2=i%2===0?W*0.11:W*0.058;
        i===0?ctx.moveTo(Math.cos(a)*r2,Math.sin(a)*r2):ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);
      }
      ctx.closePath();ctx.fillStyle='#c08808';ctx.fill();
      ctx.strokeStyle='#f0d040';ctx.lineWidth=2;ctx.stroke();
      ctx.restore();
      // grout grid
      ctx.strokeStyle='rgba(0,4,16,0.28)';ctx.lineWidth=0.8;
      for(let rr=0;rr<H;rr+=ts){ctx.beginPath();ctx.moveTo(0,rr);ctx.lineTo(W,rr);ctx.stroke();}
      for(let cc=0;cc<W;cc+=ts){ctx.beginPath();ctx.moveTo(cc,0);ctx.lineTo(cc,H);ctx.stroke();}
    });
  }

  // Arcade back-wall arabesque (warm plaster + blue/gold pattern)
  function arcadeWall(){
    return mkTex(512,512,(ctx,W,H)=>{
      ctx.fillStyle='#ddd0a6';ctx.fillRect(0,0,W,H);
      const N=4,tw=W/N;
      // alternating terracotta/cream diamonds
      for(let r=0;r<N;r++) for(let c=0;c<N;c++){
        const cx=(c+0.5)*tw,cy=(r+0.5)*tw;
        ctx.save();ctx.translate(cx,cy);ctx.rotate(Math.PI/4);
        ctx.fillStyle=(r+c)%2===0?'#c89c58':'#e8d48a';
        ctx.fillRect(-tw*0.38,-tw*0.38,tw*0.76,tw*0.76);
        ctx.restore();
      }
      // blue arabesque strokes
      ctx.strokeStyle='#183696';ctx.lineWidth=3;
      for(let r=0;r<N+1;r++) for(let c=0;c<N+1;c++){
        ctx.beginPath();ctx.arc(c*tw,r*tw,tw*0.20,0,Math.PI*2);ctx.stroke();
      }
      // 4-petal flowers at cell centers
      for(let r=0;r<N;r++) for(let c=0;c<N;c++){
        const cx=(c+0.5)*tw,cy=(r+0.5)*tw;
        ctx.strokeStyle='#1038a0';ctx.lineWidth=2.5;
        for(let p=0;p<4;p++){
          ctx.save();ctx.translate(cx,cy);ctx.rotate(p*Math.PI/2);
          ctx.beginPath();ctx.ellipse(0,-tw*0.20,tw*0.09,tw*0.20,0,0,Math.PI*2);
          ctx.stroke();ctx.restore();
        }
        ctx.beginPath();ctx.arc(cx,cy,tw*0.07,0,Math.PI*2);
        ctx.fillStyle='#d4980c';ctx.fill();
      }
      // thin grid lines
      ctx.strokeStyle='rgba(18,50,130,0.40)';ctx.lineWidth=1.5;
      for(let i=0;i<=N;i++){
        ctx.beginPath();ctx.moveTo(i*tw,0);ctx.lineTo(i*tw,H);ctx.stroke();
        ctx.beginPath();ctx.moveTo(0,i*tw);ctx.lineTo(W,i*tw);ctx.stroke();
      }
    });
  }

  // ── SCENE BUILD ──────────────────────────────────────────────────────────
  // Pre-create shared textures (clone for different repeat values)
  const _star=starTile(), _pave=stonePave(), _dome=domeMosaic(), _wall=arcadeWall();
  function useStar(ru,rv){const t=_star.clone();t.repeat.set(ru,rv);return t;}

  // Sky — Persian blue afternoon, slight haze at horizon
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(120,32,16),

  scene.add(new THREE.AmbientLight(0x90aac8,0.95));

  scene.add(new THREE.HemisphereLight(0xaaccff,0x554433,0.45));

  // Stone floor
  _pave.repeat.set(9,9);
  const fl=new THREE.Mesh(new THREE.PlaneGeometry(132,132),

  // Reflecting pool
  const poolMat=new THREE.ShaderMaterial({side:THREE.FrontSide,uniforms:uni,transparent:true,
    vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`varying vec2 vUv;uniform float uTime;void main(){
      vec2 uv=vUv-0.5;float r=length(uv);

      vec3 c=vec3(0.36,0.58,0.82)+w*vec3(0.12,0.18,0.24);
      c=mix(c,vec3(0.93,0.91,0.80),smoothstep(0.47,0.44,r)*0.28);
      gl_FragColor=vec4(c,smoothstep(0.50,0.42,r)*0.92);}`});
  const pool=new THREE.Mesh(new THREE.PlaneGeometry(10,48),poolMat);
  pool.rotation.x=-Math.PI/2;pool.position.y=0.025;scene.add(pool);

  // Fountain jets — tapered cylinders
  for(let fi=-3;fi<=3;fi++){
    const j=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.10,2.8,6),
      new THREE.MeshBasicMaterial({color:0xb8e0ff,transparent:true,opacity:0.42}));
    j.position.set(0,1.4,fi*6.5);scene.add(j);

  // East/West arcades with canvas tile textures
  function buildArcade(xPos,rotY){
    const nA=11,aW=5,aH=9.5;
    const wMat=new THREE.MeshStandardMaterial({map:useWall(5,3),roughness:0.72,metalness:0.0});
    const fMat=new THREE.MeshStandardMaterial({map:useStar(3,2),roughness:0.52,metalness:0.02});
    for(let i=0;i<nA;i++){
      const g=new THREE.Group();
      const zPos=(i-(nA-1)/2)*(aW+0.28);
      g.add(new THREE.Mesh(new THREE.PlaneGeometry(aW,aH+1),wMat));
      const aS=new THREE.Shape();
      aS.moveTo(-aW/2,0);aS.lineTo(-aW/2,aH*0.48);
      aS.quadraticCurveTo(-aW*0.34,aH*1.00,0,aH*0.52);
      aS.quadraticCurveTo(aW*0.34,aH*1.00,aW/2,aH*0.48);
      aS.lineTo(aW/2,0);aS.closePath();
      const hS=new THREE.Shape();
      hS.moveTo(-aW*0.37,0);hS.lineTo(-aW*0.37,aH*0.43);
      hS.quadraticCurveTo(-aW*0.25,aH*0.90,0,aH*0.47);
      hS.quadraticCurveTo(aW*0.25,aH*0.90,aW*0.37,aH*0.43);
      hS.lineTo(aW*0.37,0);hS.closePath();
      aS.holes=[hS];
      const fr=new THREE.Mesh(new THREE.ShapeGeometry(aS,28),fMat);
      fr.position.z=0.022;g.add(fr);
      g.position.set(xPos,0,zPos);g.rotation.y=rotY;
      scene.add(g);
    }
  }
  buildArcade(-53, Math.PI/2);
  buildArcade( 53,-Math.PI/2);

  // ── Imam Mosque (south, Masjed-e Shah) ───────────────────────────────────
  const iwan=new THREE.Group();

  // Iwan facade — star-tile
  const iwT=useStar(7,4.5);
  const iwF=new THREE.Mesh(new THREE.PlaneGeometry(32,24),
    new THREE.MeshStandardMaterial({map:iwT,roughness:0.50,metalness:0.03}));
  iwF.position.set(0,12,0);iwan.add(iwF);

  // Iwan portal opening (pointed arch, star-tile surround)
  const iAS=new THREE.Shape();
  iAS.moveTo(-11,0);iAS.lineTo(-11,9);
  iAS.quadraticCurveTo(-7,18,0,9.5);

  const iAH=new THREE.Shape();

  iAH.lineTo(8,0);iAH.closePath();
  iAS.holes=[iAH];
  const iAF=new THREE.Mesh(new THREE.ShapeGeometry(iAS,36),
    new THREE.MeshStandardMaterial({map:useStar(4,2.5),roughness:0.45,metalness:0.04}));
  iAF.position.set(0,0,0.06);iwan.add(iAF);

  // Dome — canvas mosaic
  const dome=new THREE.Mesh(new THREE.SphereGeometry(10.5,48,24,0,Math.PI*2,0,Math.PI*0.58),
    new THREE.MeshStandardMaterial({map:_dome,roughness:0.35,metalness:0.06,envMapIntensity:0.4}));
  dome.position.set(0,23,-9);iwan.add(dome);

  // Drum beneath dome
  const drumT=useStar(10,2.5);
  const drum=new THREE.Mesh(new THREE.CylinderGeometry(10.5,10.5,5.5,32),

  // Minarets — fluted, star-tile
  [-14,14].forEach(x=>{

    sh.position.y=15;mn.add(sh);
    // balcony ring
    const bal=new THREE.Mesh(new THREE.TorusGeometry(1.55,0.22,8,20),
      new THREE.MeshStandardMaterial({color:0x0a1e6a,roughness:0.5}));
    bal.position.y=28;bal.rotation.x=Math.PI/2;mn.add(bal);
    const cp=new THREE.Mesh(new THREE.ConeGeometry(1.38,4.5,16),
      new THREE.MeshStandardMaterial({color:0x060e3a,roughness:0.45}));
    cp.position.y=32.5;mn.add(cp);
    mn.position.set(x,0,-2);iwan.add(mn);
  });

  iwan.position.set(0,0,-54);iwan.rotation.y=Math.PI;
  scene.add(iwan);

  // ── Ali Qapu Palace (west) ────────────────────────────────────────────────
  const aqG=new THREE.Group();
  const aqT=useWall(3,2);
  // main block
  const aqBody=new THREE.Mesh(new THREE.BoxGeometry(18,24,9),
    new THREE.MeshStandardMaterial({map:aqT,roughness:0.72,metalness:0.0}));
  aqBody.position.y=12;aqG.add(aqBody);
  // loggia floor overhang
  const loggia=new THREE.Mesh(new THREE.BoxGeometry(22,0.6,10),
    new THREE.MeshStandardMaterial({color:0xb89a60,roughness:0.75}));
  loggia.position.y=18.4;aqG.add(loggia);
  // columns
  for(let ci=-3;ci<=3;ci++){
    const col=new THREE.Mesh(new THREE.CylinderGeometry(0.38,0.42,6.5,12),
      new THREE.MeshStandardMaterial({color:0xc8a868,roughness:0.65}));
    col.position.set(ci*2.8,15.5,-4.2);aqG.add(col);

    const cap=new THREE.Mesh(new THREE.BoxGeometry(0.90,0.55,0.90),
      new THREE.MeshStandardMaterial({color:0xb89050,roughness:0.6}));
    cap.position.set(ci*2.8,18.7,-4.2);aqG.add(cap);
  }
  aqG.position.set(-55,0,-4);aqG.rotation.y=Math.PI/2;
  scene.add(aqG);

  // ── Trees around square ───────────────────────────────────────────────────
  const positions=[[28,8],[28,-8],[-28,8],[-28,-8],[0,28],[0,-28],[20,22],[-20,22],
                   [20,-22],[-20,-22],[35,0],[-35,0]];
  positions.forEach(([px,pz])=>{

      new THREE.MeshStandardMaterial({color:0x4a3018,roughness:0.95}));
    trunk.position.y=1.75;tg.add(trunk);
    // foliage — layered spheres for fuller look
    [[0,4.5,0,2.2],[0.4,5.8,0.3,1.4],[-0.3,5.5,-0.4,1.6]].forEach(([ox,oy,oz,sr])=>{

      cr.position.set(ox,oy,oz);tg.add(cr);

    tg.position.set(px,0,pz);scene.add(tg);

  return{update(t){uni.uTime.value=t;},dispose(){}};
};

// ============================================================
//  GOLESTAN PALACE — Qajar mirror-mosaic interior
// ============================================================
locationBuilders['golestan'] = function(scene, camera, controls) {
  camera.position.set(0, 2.8, 8);
  controls.target.set(0, 3.5, -2);
  controls.minDistance=0.5;controls.maxDistance=18;
  controls.maxPolarAngle=Math.PI*0.82;controls.minPolarAngle=Math.PI*0.06;
  controls.autoRotateSpeed=0.12;
  if(locRenderer){locRenderer.toneMapping=THREE.ACESFilmicToneMapping;locRenderer.toneMappingExposure=1.25;}

  const uni={uTime:{value:0}};

  function mkTex(w,h,fn){
    const c=document.createElement('canvas');c.width=w;c.height=h;
    fn(c.getContext('2d'),w,h);
    const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
  }

  // Canvas: silver/gold mirror tesserae (Talar-e Aineh)
  const _mirror=mkTex(512,512,(ctx,W,H)=>{
    ctx.fillStyle='#0a0808';ctx.fillRect(0,0,W,H);
    const cell=64,nC=W/cell;
    ctx.strokeStyle='#c8900a';ctx.lineWidth=4;
    for(let i=0;i<=nC;i++){ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,H);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*cell);ctx.lineTo(W,i*cell);ctx.stroke();}
    const ts=9;
    for(let r=0;r<nC;r++) for(let c2=0;c2<nC;c2++){
      const ox=c2*cell,oy=r*cell,nT=Math.floor(cell/ts);
      for(let tr=0;tr<nT;tr++) for(let tc=0;tc<nT;tc++){
        const tx=ox+tc*ts+1,ty=oy+tr*ts+1;
        if(tx+ts-2>ox+cell-3||ty+ts-2>oy+cell-3) continue;
        const sd=(tr*17+tc*31+r*5+c2*11);
        const v=0.60+(Math.abs(Math.sin(sd*7.3)))*0.32;
        const w2=Math.abs(Math.sin(sd*2.7))*0.16;
        ctx.fillStyle=`rgb(${Math.round(210*v+w2*28)},${Math.round(200*v+w2*9)},${Math.round(182*v)})`;
        ctx.fillRect(tx,ty,ts-2,ts-2);
        ctx.fillStyle=`rgba(255,252,235,${0.06+(Math.abs(Math.sin(sd*1.9)))*0.38})`;
        ctx.fillRect(tx,ty,Math.ceil((ts-2)*0.4),Math.ceil((ts-2)*0.4));
      }
      const cx2=ox+cell/2,cy2=oy+cell/2;
      ctx.strokeStyle='rgba(210,155,12,0.65)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(cx2,cy2,cell*0.33,0,Math.PI*2);ctx.stroke();
      for(let p=0;p<8;p++){
        ctx.save();ctx.translate(cx2,cy2);ctx.rotate(p*Math.PI/4);
        ctx.beginPath();ctx.ellipse(0,-cell*0.18,cell*0.06,cell*0.18,0,0,Math.PI*2);
        ctx.strokeStyle='rgba(200,148,10,0.50)';ctx.lineWidth=1.2;ctx.stroke();ctx.restore();
      }
      ctx.beginPath();ctx.arc(ox,oy,4,0,Math.PI*2);ctx.fillStyle='#d4a010';ctx.fill();
    }
  });

  // Canvas: polished marble mosaic floor
  const _marble=mkTex(1024,1024,(ctx,W,H)=>{
    ctx.fillStyle='#e8e0d0';ctx.fillRect(0,0,W,H);
    const N=8,tw=W/N;
    for(let r=0;r<N;r++) for(let c2=0;c2<N;c2++){
      const x=c2*tw,y=r*tw,sd=r*17+c2*31;
      const v=0.86+(Math.abs(Math.sin(sd*7.3)))*0.14;
      const tp=sd%3;
      if(tp===0) ctx.fillStyle=`rgb(${Math.round(240*v)},${Math.round(232*v)},${Math.round(215*v)})`;
      else if(tp===1) ctx.fillStyle=`rgb(${Math.round(172*v)},${Math.round(162*v)},${Math.round(145*v)})`;
      else ctx.fillStyle=`rgb(${Math.round(192*v)},${Math.round(156*v)},${Math.round(82*v)})`;
      ctx.fillRect(x+2,y+2,tw-4,tw-4);
      ctx.save();ctx.strokeStyle='rgba(140,128,112,0.30)';ctx.lineWidth=0.8;
      for(let vi=0;vi<4;vi++){
        const s2=sd*10+vi;const sx=x+(Math.abs(Math.sin(s2*3.7)))*tw;const sy=y+(Math.abs(Math.cos(s2*4.1)))*tw;
        ctx.beginPath();ctx.moveTo(sx,sy);ctx.bezierCurveTo(sx+(Math.sin(s2*2.9)-0.5)*tw*0.6,sy+(Math.cos(s2*3.3)-0.5)*tw*0.6,sx+(Math.sin(s2*5.1)-0.5)*tw*0.7,sy+(Math.cos(s2*4.7)-0.5)*tw*0.7,sx+(Math.sin(s2*1.7)-0.5)*tw,sy+(Math.cos(s2*2.3)-0.5)*tw);
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.strokeStyle='rgba(175,128,8,0.58)';ctx.lineWidth=3;
    for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*tw,0);ctx.lineTo(i*tw,H);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*tw);ctx.lineTo(W,i*tw);ctx.stroke();}
    for(let r2=0;r2<=N;r2++) for(let c3=0;c3<=N;c3++){ctx.save();ctx.translate(c3*tw,r2*tw);ctx.rotate(Math.PI/4);ctx.fillStyle='rgba(178,132,12,0.55)';ctx.fillRect(-5,-5,10,10);ctx.restore();}
  });

  // Canvas: gilt coffered plasterwork ceiling
  const _gilt=mkTex(512,512,(ctx,W,H)=>{
    ctx.fillStyle='#2a1404';ctx.fillRect(0,0,W,H);
    const N=6,tw=W/N;
    for(let r=0;r<N;r++) for(let c2=0;c2<N;c2++){
      const cx2=c2*tw+tw/2,cy2=r*tw+tw/2;
      ctx.fillStyle='#3d1e06';ctx.fillRect(c2*tw+2,r*tw+2,tw-4,tw-4);
      const R=tw*0.40,ri=R*0.38;
      ctx.beginPath();
      for(let i=0;i<16;i++){const a=i*Math.PI/8;const r2=i%2===0?R:ri;i===0?ctx.moveTo(cx2+Math.cos(a)*r2,cy2+Math.sin(a)*r2):ctx.lineTo(cx2+Math.cos(a)*r2,cy2+Math.sin(a)*r2);}
      ctx.closePath();ctx.fillStyle='#c89010';ctx.fill();
      ctx.beginPath();
      for(let i=0;i<8;i++){const a=i*Math.PI/4;i===0?ctx.moveTo(cx2+Math.cos(a)*R*0.30,cy2+Math.sin(a)*R*0.30):ctx.lineTo(cx2+Math.cos(a)*R*0.30,cy2+Math.sin(a)*R*0.30);}
      ctx.closePath();ctx.fillStyle='#f0e0a8';ctx.fill();ctx.strokeStyle='#e0c018';ctx.lineWidth=2;ctx.stroke();
      ctx.strokeStyle='#b07e10';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(cx2,cy2,R*0.84,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.arc(cx2,cy2,R*0.57,0,Math.PI*2);ctx.stroke();
      ctx.strokeStyle='#c09012';ctx.lineWidth=2.5;ctx.strokeRect(c2*tw+5,r*tw+5,tw-10,tw-10);
      [[c2*tw+10,r*tw+10],[c2*tw+tw-10,r*tw+10],[c2*tw+10,r*tw+tw-10],[c2*tw+tw-10,r*tw+tw-10]].forEach(([lx,ly])=>{ctx.beginPath();ctx.arc(lx,ly,3.5,0,Math.PI*2);ctx.fillStyle='#d4a814';ctx.fill();});
    }
    ctx.strokeStyle='rgba(0,0,0,0.60)';ctx.lineWidth=3;
    for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*tw,0);ctx.lineTo(i*tw,H);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*tw);ctx.lineTo(W,i*tw);ctx.stroke();}
  });

  // Lighting
  scene.add(new THREE.AmbientLight(0x7a5a30,1.0));
  [[0,8.5,0],[0,8.5,-10],[0,8.5,10]].forEach(([x,y,z])=>{const l=new THREE.PointLight(0xffd070,3.5,20,1.5);l.position.set(x,y,z);scene.add(l);});
  scene.add(new THREE.HemisphereLight(0xffeedd,0x220c08,0.5));

  // Floor
  const flT=_marble.clone();flT.repeat.set(3,4);
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(24,36),new THREE.MeshStandardMaterial({map:flT,roughness:0.18,metalness:0.10}));
  floor.rotation.x=-Math.PI/2;floor.position.set(0,0,-6);scene.add(floor);

  // Mirror walls — canvas tessera base + GPU shimmer animation
  function mirrorWall(w,h,pos,rotY){
    const mT=_mirror.clone();mT.repeat.set(Math.ceil(w/3.2),Math.ceil(h/3.2));
    const mat=new THREE.ShaderMaterial({side:THREE.DoubleSide,uniforms:{uTime:uni.uTime,uTex:{value:mT}},
      vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
      fragmentShader:`uniform float uTime;uniform sampler2D uTex;varying vec2 vUv;
        float hh(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
        void main(){
          vec4 tex=texture2D(uTex,vUv);
          vec2 mu=vUv*vec2(110.0,70.0);float rnd=hh(floor(mu));
          float sh1=sin(uTime*1.1+rnd*6.28)*0.5+0.5;
          float sh2=cos(uTime*0.72+rnd*9.1+1.2)*0.5+0.5;
          vec3 c=tex.rgb;
          c+=vec3(0.50,0.32,0.04)*sh1*rnd*0.42;
          c+=vec3(0.0,0.06,0.18)*sh2*(1.0-rnd)*0.16;
          c=clamp(c,0.0,1.0);
          gl_FragColor=vec4(c,1.0);}` });
    const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);
    m.position.copy(pos);m.rotation.y=rotY;scene.add(m);return mat;
  }

  const mirrorMats=[];
  mirrorMats.push(mirrorWall(24,10,new THREE.Vector3(0,5,-18),0));
  mirrorMats.push(mirrorWall(24,10,new THREE.Vector3(0,5, 12),Math.PI));
  mirrorMats.push(mirrorWall(36,10,new THREE.Vector3(-12,5,-3),Math.PI/2));
  mirrorMats.push(mirrorWall(36,10,new THREE.Vector3( 12,5,-3),-Math.PI/2));

  // Ceiling
  const cT=_gilt.clone();cT.repeat.set(3,5);
  const ceil2=new THREE.Mesh(new THREE.PlaneGeometry(24,36),
    new THREE.MeshStandardMaterial({map:cT,roughness:0.30,metalness:0.15,emissive:new THREE.Color(0.08,0.04,0.0),emissiveIntensity:0.28}));
  ceil2.rotation.x=Math.PI/2;ceil2.position.set(0,9.8,-6);scene.add(ceil2);

  // Takhte Marmar throne
  const throneBase=new THREE.Mesh(new THREE.BoxGeometry(6,0.6,3.5),new THREE.MeshStandardMaterial({color:0xd4c4a0,roughness:0.45,metalness:0.06}));
  throneBase.position.set(0,0.3,-14);scene.add(throneBase);
  const thrT=_marble.clone();thrT.repeat.set(4,2.5);
  const throne=new THREE.Mesh(new THREE.BoxGeometry(3.5,2.5,1.8),new THREE.MeshStandardMaterial({map:thrT,roughness:0.22,metalness:0.05}));
  throne.position.set(0,1.8,-14.2);scene.add(throne);

  // Chandeliers
  [0,-12,12].forEach(z=>{
    const chain=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,2.5,6),new THREE.MeshStandardMaterial({color:0xd4a020,metalness:0.8,roughness:0.3}));
    chain.position.set(0,8.8,z);scene.add(chain);
    const body2=new THREE.Mesh(new THREE.SphereGeometry(0.9,12,8),new THREE.MeshStandardMaterial({color:0xd4a020,metalness:0.7,roughness:0.2}));
    body2.position.set(0,7.2,z);scene.add(body2);
  });

  return{update(t){uni.uTime.value=t;mirrorMats.forEach(m=>m.uniforms.uTime.value=t);},dispose(){}};
};

// ============================================================
//  BADAB-E SURT — Terraced mineral springs
// ============================================================
locationBuilders['badab-e-surt'] = function(scene, camera, controls) {
  camera.position.set(0, 8, 22);
  controls.target.set(0, 4, 0);
  controls.minDistance=1;controls.maxDistance=40;
  controls.maxPolarAngle=Math.PI*0.78;controls.minPolarAngle=Math.PI*0.04;
  controls.autoRotateSpeed=0.10;
  if(locRenderer){locRenderer.toneMapping=THREE.ACESFilmicToneMapping;locRenderer.toneMappingExposure=1.15;}

  const uni={uTime:{value:0}};

  // Sunset sky
  const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,uniforms:uni,
    vertexShader:`varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`uniform float uTime;varying vec3 vP;
      void main(){float h=normalize(vP).y;
        vec3 c=h<0.0?vec3(0.45,0.08,0.04):
               h<0.12?mix(vec3(0.90,0.30,0.05),vec3(0.95,0.55,0.08),h/0.12):
               h<0.4?mix(vec3(0.95,0.55,0.08),vec3(0.72,0.28,0.45),(h-0.12)/0.28):
               mix(vec3(0.72,0.28,0.45),vec3(0.15,0.08,0.22),(h-0.4)/0.6);
        gl_FragColor=vec4(c,1.0);}`});
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(80,32,16),skyMat));

  scene.add(new THREE.AmbientLight(0x5a2808,0.8));
  const sunL=new THREE.DirectionalLight(0xff8822,2.8);
  sunL.position.set(-4,3,-6);scene.add(sunL);
  scene.add(new THREE.HemisphereLight(0xff6622,0x1a0802,0.4));

  function mkTexB(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}

  // 4 travertine canvas textures spanning cream → orange → rust
  const _travTexes=(()=>{
    const palettes=[
      [[0.90,0.83,0.68],[0.82,0.72,0.55]],  // cream (top steps)
      [[0.82,0.56,0.28],[0.72,0.44,0.16]],  // tan-orange
      [[0.80,0.34,0.08],[0.68,0.26,0.06]],  // orange
      [[0.56,0.14,0.04],[0.44,0.10,0.03]],  // deep rust (bottom)
    ];
    return palettes.map(([col1,col2])=>mkTexB(512,256,(ctx,W,H)=>{
      const r1=Math.round(col1[0]*255),g1=Math.round(col1[1]*255),b1=Math.round(col1[2]*255);
      ctx.fillStyle=`rgb(${r1},${g1},${b1})`;ctx.fillRect(0,0,W,H);
      // Horizontal mineral deposit bands
      const bandH=6;
      for(let y=0;y<H;y+=bandH){
        const t2=y/H;const blend=col1.map((v,i)=>v*(1-t2)+col2[i]*t2);
        const bv=0.88+(Math.abs(Math.sin(y*0.18)))*0.12;
        ctx.fillStyle=`rgb(${Math.round(blend[0]*255*bv)},${Math.round(blend[1]*255*bv)},${Math.round(blend[2]*255*bv)})`;
        ctx.fillRect(0,y,W,bandH);
        // Crystalline edge line
        if(Math.abs(Math.sin(y*0.3))>0.7){
          ctx.strokeStyle=`rgba(255,240,200,${0.25+(Math.abs(Math.sin(y*0.5)))*0.20})`;
          ctx.lineWidth=0.8;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y+(Math.sin(y*0.4)-0.5)*2);ctx.stroke();
        }
      }
      // Porous travertine holes (characteristic mineral bubbles)
      ctx.fillStyle='rgba(40,20,8,0.55)';
      for(let pi=0;pi<25;pi++){
        const px=(pi*W/25+pi*37)%W,py=(pi*H/25+pi*53)%H;
        const pr=1+Math.abs(Math.sin(pi*1.7))*4;
        ctx.beginPath();ctx.ellipse(px,py,pr,pr*0.6,Math.PI*0.3+pi*0.4,0,Math.PI*2);ctx.fill();
      }
      // Flow marks
      ctx.strokeStyle='rgba(255,200,100,0.15)';ctx.lineWidth=1.2;
      for(let fi=0;fi<8;fi++){
        ctx.beginPath();ctx.moveTo((fi*W/8)%W,0);
        ctx.bezierCurveTo((fi*W/8+30)%W,H*0.3,(fi*W/8-20+W)%W,H*0.6,(fi*W/8+15)%W,H);ctx.stroke();
      }
    }));
  })();

  // Terraced geometry: 14 steps descending
  const nSteps=14;
  for(let s=0;s<nSteps;s++){
    const t=s/nSteps;
    const w=22-s*0.6;
    const z=-s*2.8+12;
    const y=nSteps*0.5-s*0.5;

    // Travertine riser — canvas texture
    const travIdx=Math.min(3,Math.floor(t*4));
    const rT=_travTexes[travIdx].clone();rT.repeat.set(Math.ceil(w/3),1);
    const riser=new THREE.Mesh(new THREE.PlaneGeometry(w,0.5),
      new THREE.MeshStandardMaterial({map:rT,roughness:0.75,metalness:0.0,side:THREE.DoubleSide}));
    riser.position.set(0,y+0.25,z+0.01);scene.add(riser);

    // Water pool surface on each terrace
    const poolUni={uTime:{value:0},uS:{value:s/nSteps}};
    const pMat=new THREE.ShaderMaterial({side:THREE.FrontSide,transparent:true,uniforms:poolUni,
      vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
      fragmentShader:`uniform float uTime;uniform float uS;varying vec2 vUv;
        void main(){
          vec3 tq=vec3(0.30,0.68,0.62);vec3 org2=vec3(0.75,0.32,0.05);
          vec3 base=mix(tq,org2,uS);
          float rip=sin(length(vUv-0.5)*22.0-uTime*2.5)*0.04+sin((vUv.x-0.5)*16.0-uTime*2.0)*0.03;
          base+=rip*vec3(0.20,0.25,0.30);
          float ef=smoothstep(0.0,0.08,min(min(vUv.x,1.0-vUv.x),min(vUv.y,1.0-vUv.y)));
          base=mix(base,vec3(0.92,0.88,0.80),(1.0-ef)*0.65);
          base+=vec3(0.45,0.18,0.04)*0.18*(sin(uTime*0.3)*0.5+0.5);
          gl_FragColor=vec4(base,ef*0.88+0.10);}` });
    const pool2=new THREE.Mesh(new THREE.PlaneGeometry(w-0.4,2.2),pMat);
    pool2.rotation.x=-Math.PI/2;pool2.position.set(0,y+0.02,z-1.0);
    pool2.userData.pUni=poolUni;scene.add(pool2);

    // Travertine terrace floor — canvas texture
    const terT=_travTexes[travIdx].clone();terT.repeat.set(Math.ceil(w/3),1);
    const terr=new THREE.Mesh(new THREE.PlaneGeometry(w,2.5),
      new THREE.MeshStandardMaterial({map:terT,roughness:0.78,metalness:0.0}));
    terr.rotation.x=-Math.PI/2;terr.position.set(0,y,z-1.3);scene.add(terr);
  }

  // Background hills
  for(let hi=0;hi<12;hi++){
    const hh=8+Math.random()*14;const hw=15+Math.random()*20;
    const hm=new THREE.Mesh(new THREE.ConeGeometry(hw/2,hh,8),
      new THREE.MeshBasicMaterial({color:new THREE.Color(0.28,0.12,0.06)}));
    const a=hi/12*Math.PI*2;
    hm.position.set(Math.sin(a)*58,hh/2-1,Math.cos(a)*55);
    scene.add(hm);
  }

  // Water overflow streams
  for(let wi=0;wi<4;wi++){
    const wx=(wi-1.5)*4;
    const sGeo=new THREE.PlaneGeometry(0.3,nSteps*2.8);
    const sMat=new THREE.ShaderMaterial({side:THREE.DoubleSide,transparent:true,uniforms:uni,
      vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
      fragmentShader:`uniform float uTime;varying vec2 vUv;
        void main(){
          float flow=sin(vUv.y*20.0-uTime*3.0)*0.5+0.5;
          vec3 c=mix(vec3(0.40,0.78,0.72),vec3(0.80,0.40,0.10),vUv.y);
          c*=0.7+flow*0.3;
          gl_FragColor=vec4(c,0.7);}`});
    const stream=new THREE.Mesh(sGeo,sMat);
    stream.rotation.x=-Math.PI/12;
    stream.position.set(wx,nSteps*0.25/2,nSteps*0.5*0.5-6);
    scene.add(stream);
  }

  return{update(t){
    uni.uTime.value=t;
    scene.traverse(o=>{if(o.userData.pUni)o.userData.pUni.uTime.value=t;});
  },dispose(){}};
};
